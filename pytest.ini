[pytest]
; minversion = 6.0
; addopts = -ra -q
pythonpath =
    .
testpaths =
    tests

; Uncomment following to enable verbose logging during tests execution
; log_cli = true
; log_level = DEBUG
; log_cli_level = 10
; log_cli_format = %(asctime)s %(levelname)s %(message)s
; log_cli_date_format = %Y-%m-%d %H:%M:%S
