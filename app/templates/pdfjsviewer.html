            layer.className = "pdf-links";

            layer.style.width =
                viewport.width + "px";

            layer.style.height =
                viewport.height + "px";

            for (const annotation of annotations) {
                if (annotation.subtype !== "Link") {
                    continue;
                }

                if (!annotation.rect) continue;

                const rectangle =
                    viewport.convertToViewportRectangle(
                        annotation.rect
                    );

                const left = Math.min(
                    rectangle[0],
                    rectangle[2]
                );

                const top = Math.min(
                    rectangle[1],
                    rectangle[3]
                );

                const width = Math.abs(
                    rectangle[2] - rectangle[0]
                );

                const height = Math.abs(
                    rectangle[3] - rectangle[1]
                );

                if (width <= 0 || height <= 0) {
                    continue;
                }

                const link =
                    document.createElement("a");

                link.className = "pdf-link";

                link.style.left = left + "px";
                link.style.top = top + "px";
                link.style.width = width + "px";
                link.style.height = height + "px";

                link.setAttribute(
                    "aria-label",
                    annotation.title ||
                    "Lien du document PDF"
                );

                const externalUrl =
                    annotation.url ||
                    annotation.unsafeUrl;

                if (externalUrl) {
                    let safeUrl = null;

                    try {
                        const parsed = new URL(
                            externalUrl,
                            window.location.href
                        );

                        if (
                            parsed.protocol === "http:" ||
                            parsed.protocol === "https:" ||
                            parsed.protocol === "mailto:" ||
                            parsed.protocol === "tel:"
                        ) {
                            safeUrl = parsed.href;
                        }

                    } catch (_) {}

                    if (!safeUrl) continue;

                    link.href = safeUrl;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.title = safeUrl;

                } else if (annotation.dest != null) {
                    link.href = "#";

                    link.addEventListener(
                        "click",
                        event => {
                            event.preventDefault();

                            goToDestination(
                                annotation.dest,
                                true
                            );
                        }
                    );

                } else {
                    continue;
                }

                layer.appendChild(link);
            }

            if (layer.childElementCount > 0) {
                info.shell.appendChild(layer);
                info.linksLayer = layer;
            }
        }

        // =========================================
        // CACHE DES CANVASES ET COUCHES DE TEXTE
        // =========================================

        function touchPage(info) {
            info.lastUsed = ++usageCounter;
        }

        function findEvictionCandidate(protectedPage) {
            const rect = getContainerRect();

            let candidate = null;

            for (const info of pages) {
                if (
                    !info.rendered ||
                    info === protectedPage ||
                    info.rendering
                ) {
                    continue;
                }

                const pageRect =
                    info.shell.getBoundingClientRect();

                const farAway =
                    pageRect.bottom <
                        rect.top - EVICTION_DISTANCE ||
                    pageRect.top >
                        rect.bottom + EVICTION_DISTANCE;

                if (!farAway) continue;

                if (
                    !candidate ||
                    info.lastUsed < candidate.lastUsed
                ) {
                    candidate = info;
                }
            }

            return candidate;
        }

        function evictCanvases(protectedPage) {
            while (
                cachedCanvasCount >= MAX_CACHED_CANVASES
            ) {
                const candidate =
                    findEvictionCandidate(protectedPage);

                if (!candidate) return;

                releaseCanvas(candidate);
            }
        }

        /*
         * Supprime le canvas et sa couche de texte.
         */

        function releaseCanvas(info) {
            if (!info.canvas) return;

            if (info.renderTask) {
                try {
                    info.renderTask.cancel();
                } catch (_) {}
            }

            if (info.textLayerTask) {
                try {
                    info.textLayerTask.cancel();
                } catch (_) {}
            }

            const canvas = info.canvas;

            info.generation++;

            info.canvas = null;
            info.rendered = false;
            info.rendering = false;

            info.renderTask = null;
            info.textLayerTask = null;

            canvas.width = 0;
            canvas.height = 0;

            info.shell.replaceChildren();

            const placeholder =
                document.createElement("div");

            placeholder.className = "page-placeholder";

            placeholder.textContent =
                "Page " + info.pageNumber;

            info.shell.appendChild(placeholder);

            info.textLayer = null;
            info.linksLayer = null;
            info.highlightLayer = null;

            cachedCanvasCount = Math.max(
                0,
                cachedCanvasCount - 1
            );
        }

        // =========================================
        // TEXTE UTILISÉ PAR LA RECHERCHE
        // =========================================

        async function getPageText(info) {
            if (info.textContent) {
                return info.textContent;
            }

            if (info.textPromise) {
                return info.textPromise;
            }

            info.textPromise = (async () => {
                const page =
                    await pdfDoc.getPage(info.pageNumber);

                const content =
                    await page.getTextContent();

                info.textContent = content.items
                    .filter(item =>
                        typeof item.str === "string"
                    )
                    .map(item => ({
                        str: item.str,
                        transform: item.transform,
                        width: item.width,
                        height: item.height
                    }));

                return info.textContent;
            })();

            try {
                return await info.textPromise;

            } finally {
                info.textPromise = null;
            }
        }

        // =========================================
        // RECHERCHE
        // =========================================

        function normalizeText(text, matchCase) {
            return matchCase
                ? text
                : text.toLocaleLowerCase();
        }

        function isWordCharacter(char) {
            return /[\p{L}\p{N}_]/u.test(char || "");
        }

        function findOccurrences(
            text,
            query,
            options
        ) {
            const results = [];

            const source = normalizeText(
                text,
                options.matchCase
            );

            const needle = normalizeText(
                query,
                options.matchCase
            );

            if (!needle.length) return results;

            let position = 0;

            while (
                position <= source.length - needle.length
            ) {
                const index = source.indexOf(
                    needle,
                    position
                );

                if (index === -1) break;

                const end = index + needle.length;

                let valid = true;

                if (options.wholeWord) {
                    if (
                        isWordCharacter(source[index - 1]) ||
                        isWordCharacter(source[end])
                    ) {
                        valid = false;
                    }
                }

                if (valid) {
                    results.push({
                        start: index,
                        end
                    });
                }

                position = index + 1;
            }

            return results;
        }

        let searchResults = [];
        let selectedResultIndex = -1;

        let searchGeneration = 0;
        let searchTimer = null;
        let searchInProgress = false;
        let searchNavigationGeneration = 0;

        // pages analysed by the search in progress
        let searchScannedPages = 0;

        /*
         * Statut de la recherche, d'après son état : les résultats sont
         * montrés pendant l'analyse ("2/12… — page 5 — analyse
         * 150/280"), leur nombre est final à la fin ("2/37 — page 5").
         */
        function updateSearchStatus() {
            const count = searchResults.length;
            const analysis = searchInProgress
                ? "analyse " + searchScannedPages + "/" + pages.length
                : "";

            if (!count) {
                searchStatus.textContent = searchInProgress
                    ? "Recherche… — " + analysis
                    : "Aucun résultat";
                return;
            }

            const total = count + (searchInProgress ? "…" : "");
            const parts = [];

            if (selectedResultIndex >= 0) {
                parts.push((selectedResultIndex + 1) + "/" + total);
                parts.push("page " + searchResults[selectedResultIndex].pageNumber);
            } else {
                parts.push(total + (count > 1 ? " occurrences" : " occurrence"));
            }

            if (analysis) {
                parts.push(analysis);
            }

            searchStatus.textContent = parts.join(" — ");
        }

        async function performSearch() {
            const generation = ++searchGeneration;

            const query = searchInput.value.trim();

            searchResults = [];
            selectedResultIndex = -1;

            clearAllHighlights();

            if (!query) {
                searchInProgress = false;

                searchStatus.textContent =
                    "Saisissez un texte";

                return;
            }

            searchInProgress = true;
            searchScannedPages = 0;
            updateSearchStatus();

            const options = {
                matchCase: matchCaseCheckbox.checked,
                wholeWord: wholeWordCheckbox.checked
            };

            try {
                for (let i = 0; i < pages.length; i++) {
                    if (
                        destroyed ||
                        generation !== searchGeneration
                    ) {
                        return;
                    }

                    const info = pages[i];

                    const items = await getPageText(info);

                    if (
                        destroyed ||
                        generation !== searchGeneration
                    ) {
                        return;
                    }

                    const found = searchResults.length;

                    for (
                        let itemIndex = 0;
                        itemIndex < items.length;
                        itemIndex++
                    ) {
                        const item = items[itemIndex];

                        const matches = findOccurrences(
                            item.str,
                            query,
                            options
                        );

                        for (const match of matches) {
                            searchResults.push({
                                pageNumber: info.pageNumber,
                                itemIndex,
                                start: match.start,
                                end: match.end
                            });
                        }
                    }

                    searchScannedPages = i + 1;

                    if (searchResults.length > found) {
                        // a page already shown: its results highlighted
                        // (the other ones are when they are rendered)
                        drawHighlights(info);

                        // the first result: shown at once, the analysis
                        // goes on (unless the user already moved)
                        if (selectedResultIndex < 0) {
                            selectSearchResult(0);
                        }
                    }

                    if (
                        searchResults.length > found ||
                        i % 10 === 0 ||
                        i === pages.length - 1
                    ) {
                        updateSearchStatus();

                        await new Promise(resolve =>
                            setTimeout(resolve, 0)
                        );
                    }
                }

                if (
                    destroyed ||
                    generation !== searchGeneration
                ) {
                    return;
                }

                searchInProgress = false;

                updateSearchStatus();

            } catch (error) {
                console.error(
                    "Erreur de recherche :",
                    error
                );

                searchInProgress = false;

                searchStatus.textContent =
                    "Erreur lors de la recherche";
            }
        }

        function scheduleSearch() {
            clearTimeout(searchTimer);

            searchTimer = setTimeout(
                performSearch,
                250
            );
        }

        /*
         * Résultat suivant / précédent, parmi ceux déjà trouvés : pendant
         * l'analyse, on ne fait pas le tour (d'autres résultats peuvent
         * encore venir après le dernier).
         */
        async function navigateSearch(direction) {
            if (!searchResults.length) {
                if (!searchInProgress && searchInput.value.trim()) {
                    await performSearch();
                }

                return;
            }

            const last = searchResults.length - 1;
            let nextIndex;

            if (selectedResultIndex < 0) {
                nextIndex = direction > 0 || searchInProgress
                    ? 0
                    : last;

            } else {
                nextIndex =
                    selectedResultIndex + direction;

                if (nextIndex > last) {
                    nextIndex = searchInProgress ? last : 0;
                }

                if (nextIndex < 0) {
                    nextIndex = searchInProgress ? 0 : last;
                }
            }

            if (nextIndex === selectedResultIndex) {
                return;
            }

            await selectSearchResult(nextIndex);
        }

        async function selectSearchResult(index) {
            if (
                index < 0 ||
                index >= searchResults.length
            ) {
                return;
            }

            const generation =
                ++searchNavigationGeneration;

            selectedResultIndex = index;

            const result = searchResults[index];

            updateSearchStatus();

            // le point de vue d'avant le premier saut de la recherche,
            // lu une seule fois (les sauts suivants attendent la lecture)
            if (!searchOrigin) {
                searchOrigin = captureView();
                updateHistoryButtons();
            }

            await searchOrigin;

            if (
                destroyed ||
                generation !== searchNavigationGeneration
            ) {
                return;
            }

            await goToPage(result.pageNumber);

            if (
                destroyed ||
                generation !== searchNavigationGeneration
            ) {
                return;
            }

            const info =
                pages[result.pageNumber - 1];

            requestRender(info, 1000);

            drawHighlights(info);

            waitForPageRender(info, generation);
        }

        async function waitForPageRender(
            info,
            generation
        ) {
            const started = Date.now();

            while (
                !destroyed &&
                generation === searchNavigationGeneration &&
                Date.now() - started < 10000
            ) {
                if (info.rendered) {
                    drawHighlights(info);
                    return;
                }

                await new Promise(resolve =>
                    setTimeout(resolve, 80)
                );
            }
        }

        // =========================================
        // SURIGNAGE DE LA RECHERCHE
        // =========================================

        function clearAllHighlights() {
            for (const info of pages) {
                if (info.highlightLayer) {
                    info.highlightLayer.remove();
                    info.highlightLayer = null;
                }
            }
        }

        function drawHighlights(info) {
            if (!info.rendered || !info.canvas) {
                return;
            }

            if (info.highlightLayer) {
                info.highlightLayer.remove();
                info.highlightLayer = null;
            }

            const matches = searchResults.filter(
                result =>
                    result.pageNumber === info.pageNumber
            );

            if (!matches.length) return;

            const items = info.textContent;

            if (!items) return;

            const layer = document.createElement("div");

            layer.className = "search-highlights";

            layer.style.width =
                info.widthAtScale1 * scale + "px";

            layer.style.height =
                info.heightAtScale1 * scale + "px";

            for (const match of matches) {
                const item = items[match.itemIndex];

                if (!item || !item.transform) continue;

                const transform = item.transform;

                const x = transform[4] * scale;

                const fontHeight = Math.max(
                    4,
                    Math.hypot(
                        transform[2],
                        transform[3]
                    ) * scale
                );

                const width = Math.max(
                    3,
                    item.width * scale
                );

                const y = (
                    info.heightAtScale1 -
                    transform[5]
                ) * scale;

                const top = y - fontHeight;

                const highlight =
                    document.createElement("div");

                highlight.className =
                    "search-highlight";

                if (
                    searchResults[selectedResultIndex] === match
                ) {
                    highlight.classList.add("current");
                }

                highlight.style.left = x + "px";
                highlight.style.top = top + "px";
                highlight.style.width = width + "px";

                highlight.style.height =
                    Math.max(
                        5,
                        fontHeight * 1.15
                    ) + "px";

                layer.appendChild(highlight);
            }

            info.shell.appendChild(layer);
            info.highlightLayer = layer;
        }

        function clearSearch() {
            searchGeneration++;
            searchNavigationGeneration++;

            clearTimeout(searchTimer);

            searchInProgress = false;

            searchResults = [];
            selectedResultIndex = -1;

            searchInput.value = "";

            clearAllHighlights();

            searchStatus.textContent =
                "Saisissez un texte";
        }

        function openSearch() {
            searchbar.classList.add("visible");

            searchInput.focus();
            searchInput.select();
        }

        function closeSearch() {
            searchbar.classList.remove("visible");

            // la recherche est validée : ses sauts dans l'historique
            commitSearchOrigin();

            clearSearch();

            container.focus();
        }

        // =========================================
        // PAGE COURANTE ET DÉFILEMENT
        // =========================================

        function findCurrentPage() {
            if (!pages.length) return 1;

            const rect = getContainerRect();

            const referenceY = rect.top + 40;

            let bestPage = 1;
            let bestDistance = Infinity;

            for (const info of pages) {
                const pageRect =
                    info.shell.getBoundingClientRect();

                if (
                    pageRect.top <= referenceY &&
                    pageRect.bottom > referenceY
                ) {
                    return info.pageNumber;
                }

                const distance = Math.min(
                    Math.abs(
                        pageRect.top - referenceY
                    ),
                    Math.abs(
                        pageRect.bottom - referenceY
                    )
                );

                if (distance < bestDistance) {
                    bestDistance = distance;
                    bestPage = info.pageNumber;
                }
            }

            return bestPage;
        }

        function scheduleViewportUpdate() {
            if (scrollFrame !== null) return;

            scrollFrame = requestAnimationFrame(() => {
                scrollFrame = null;

                if (destroyed || !pdfDoc) return;

                currentPageNumber = findCurrentPage();

                currentPageInput.value =
                    currentPageNumber;

                updateStatus(
                    "Page " + currentPageNumber +
                    " / " + pdfDoc.numPages +
                    " — " + cachedCanvasCount +
                    " canvases"
                );

                updateActiveOutline(currentPageNumber);

                evictCanvases(null);

                /*
                 * L'état est sauvegardé après la fin du défilement,
                 * et non à chaque événement scroll.
                 */
                scheduleStateSync();
            });
        }

        async function goToPage(pageNumber) {
            if (!pdfDoc) return;

            if (
                !Number.isInteger(pageNumber) ||
                pageNumber < 1 ||
                pageNumber > pdfDoc.numPages
            ) {
                currentPageInput.value =
                    currentPageNumber;

                return;
            }

            const info = pages[pageNumber - 1];

            currentPageNumber = pageNumber;
            currentPageInput.value = pageNumber;

            await loadPageMetadata(info);

            updateShellSize(info);

            const containerRect =
                getContainerRect();

            const pageRect =
                info.shell.getBoundingClientRect();

            const target =
                container.scrollTop +
                pageRect.top -
                containerRect.top;

            container.scrollTo({
                top: target,
                behavior: "auto"
            });

            requestRender(info, 1000);

            scheduleViewportUpdate();
            scheduleStateSync();
        }

        // =========================================
        // ZOOM
        // =========================================

        /*
         * Pinch (touch screen, two fingers): the pages scaled as a whole
         * while the fingers move, then drawn again at the new zoom
         * (setZoom()), the point of the document between the fingers kept
         * under them. The browser does not zoom the page there
         * (touch-action of #pdf-container).
         */
        function setupPinchZoom() {
            const touches = new Map();
            let pinch = null;

            function fingers() {
                const [a, b] = [...touches.values()];

                return {
                    x: (a.x + b.x) / 2,
                    y: (a.y + b.y) / 2,
                    distance: Math.hypot(a.x - b.x, a.y - b.y)
                };
            }

            // the page under a point of the screen
            function pageAt(y) {
                for (const info of pages) {
                    const rect = info.shell.getBoundingClientRect();

                    if (rect.top <= y && rect.bottom > y) {
                        return info;
                    }
                }

                return null;
            }

            function start() {
                const f = fingers();
                const info = pageAt(f.y);

                if (!pdfDoc || !info || f.distance < 10) return;

                const page = info.shell.getBoundingClientRect();
                const box = pagesBox.getBoundingClientRect();

                pinch = {
                    distance: f.distance,
                    factor: 1,
                    x: f.x,
                    y: f.y,
                    info,
                    // the point between the fingers, in its page
                    fx: (f.x - page.left) / page.width,
                    fy: (f.y - page.top) / page.height
                };

                pagesBox.style.transformOrigin =
                    (f.x - box.left) + "px " + (f.y - box.top) + "px";
            }

            function move() {
                const f = fingers();

                pinch.factor = clamp(
                    f.distance / pinch.distance,
                    MIN_SCALE / scale,
                    MAX_SCALE / scale
                );
                pinch.x = f.x;
                pinch.y = f.y;

                pagesBox.style.transform = "scale(" + pinch.factor + ")";
            }

            async function end() {
                const { factor, x, y, info, fx, fy } = pinch;

                pinch = null;
                pagesBox.style.transform = "";
                pagesBox.style.transformOrigin = "";

                if (Math.abs(factor - 1) < 0.02) return;

                await setZoom(scale * factor);
                await nextFrame();

                // the same point of the page under the fingers
                const page = info.shell.getBoundingClientRect();

                container.scrollTo({
                    left: container.scrollLeft + page.left + fx * page.width - x,
                    top: container.scrollTop + page.top + fy * page.height - y,
                    behavior: "auto"
                });

                scheduleViewportUpdate();
            }

            container.addEventListener("pointerdown", event => {
                if (event.pointerType !== "touch") return;

                touches.set(event.pointerId, {
                    x: event.clientX,
                    y: event.clientY
                });

                if (touches.size === 2 && !pinch) {
                    start();
                }
            });

            container.addEventListener("pointermove", event => {
                if (!touches.has(event.pointerId)) return;

                touches.set(event.pointerId, {
                    x: event.clientX,
                    y: event.clientY
                });

                if (pinch && touches.size >= 2) {
                    move();
                }
            });

            for (const type of ["pointerup", "pointercancel"]) {
                container.addEventListener(type, event => {
                    if (!touches.delete(event.pointerId)) return;

                    if (pinch && touches.size < 2) {
                        end();
                    }
                });
            }
        }

        async function changeZoom(delta) {
            if (!pdfDoc) return;

            const newScale = clamp(
                Math.round(
                    (scale + delta) * 100
                ) / 100,
                MIN_SCALE,
                MAX_SCALE
            );

            if (newScale === scale) return;

            await setZoom(newScale);
        }

        async function applyManualZoom() {
            if (!pdfDoc) return;

            let percentage =
                Number(zoomLevelInput.value);

            if (!Number.isFinite(percentage)) {
                zoomLevelInput.value =
                    Math.round(scale * 100);

                return;
            }

            percentage = clamp(
                percentage,
                MIN_SCALE * 100,
                MAX_SCALE * 100
            );

            percentage = Math.round(percentage);

            zoomLevelInput.value = percentage;

            await setZoom(percentage / 100);
        }

        async function fitPageWidth() {
            if (!pdfDoc || !pages.length) return;

            try {
                const referencePage = pages[0];

                await loadPageMetadata(referencePage);

                // (without the padding: the margin of the notes, when shown)
                const containerStyle = getComputedStyle(container);
                const availableWidth =
                    container.clientWidth
                    - parseFloat(containerStyle.paddingLeft)
                    - parseFloat(containerStyle.paddingRight);

                if (availableWidth <= 0) return;

                const newScale =
                    availableWidth /
                    referencePage.widthAtScale1;

                await setZoom(
                    clamp(
                        newScale,
                        MIN_SCALE,
                        MAX_SCALE
                    )
                );

            } catch (error) {
                console.error(
                    "Impossible d'adapter la largeur :",
                    error
                );
            }
        }

        async function setZoom(
            newScale,
            preservePosition = true
        ) {
            if (!pdfDoc) return;

            newScale = clamp(
                newScale,
                MIN_SCALE,
                MAX_SCALE
            );

            if (
                Math.abs(newScale - scale) < 0.001
            ) {
                zoomLevelInput.value =
                    Math.round(scale * 100);

                return;
            }

            const anchorNumber = findCurrentPage();
            const anchor = pages[anchorNumber - 1];

            const oldContainerRect =
                getContainerRect();

            const oldPageRect =
                anchor.shell.getBoundingClientRect();

            const oldOffset =
                oldPageRect.top -
                oldContainerRect.top;

            scale = newScale;

            zoomLevelInput.value =
                Math.round(scale * 100);

            /*
             * Invalider les rendus précédents.
             *
             * Les caches textuels restent disponibles,
             * mais les couches visuelles sont reconstruites.
             */

            for (const info of pages) {
                if (info.renderTask) {
                    try {
                        info.renderTask.cancel();
                    } catch (_) {}
                }

                if (info.textLayerTask) {
                    try {
                        info.textLayerTask.cancel();
                    } catch (_) {}
                }

                info.generation++;

                info.renderTask = null;
                info.textLayerTask = null;
                info.rendering = false;

                if (info.canvas) {
                    info.canvas.width = 0;
                    info.canvas.height = 0;

                    info.canvas = null;
                    info.rendered = false;

                    cachedCanvasCount--;
                }

                if (info.textLayer) {
                    info.textLayer.remove();
                    info.textLayer = null;
                }

                if (info.linksLayer) {
                    info.linksLayer.remove();
                    info.linksLayer = null;
                }

                if (info.highlightLayer) {
                    info.highlightLayer.remove();
                    info.highlightLayer = null;
                }

                info.shell.replaceChildren();

                const placeholder =
                    document.createElement("div");

                placeholder.className =
                    "page-placeholder";

                placeholder.textContent =
                    "Page " + info.pageNumber;

                info.shell.appendChild(placeholder);

                updateShellSize(info);
            }

            cachedCanvasCount = Math.max(
                0,
                cachedCanvasCount
            );

            renderQueue.length = 0;
            queuedPages.clear();

            if (preservePosition) {
                const newContainerRect =
                    getContainerRect();

                const newPageRect =
                    anchor.shell.getBoundingClientRect();

                container.scrollTop +=
                    newPageRect.top -
                    newContainerRect.top -
                    oldOffset;
            }

            requestRender(anchor, 1000);

            scheduleViewportUpdate();
            scheduleStateSync();
        }

        // =========================================
        // COMMANDES ET RACCOURCIS
        // =========================================

        function setupControls() {

            $("toggleSidebar").addEventListener(
                "click",
                () => {
                    // over the document: shown or hidden, without
                    // changing its width (see the end of the page)
                    if (document.body.classList.contains("sidebar-overlay")) {
                        document.body.classList.toggle("sidebar-open");
                        return;
                    }

                    workspace.classList.toggle(
                        "sidebar-hidden"
                    );

                    setTimeout(
                        scheduleViewportUpdate,
                        180
                    );
                }
            );

            /*
             * Navigation dans l'historique.
             */

            backButton.addEventListener(
                "click",
                goBack
            );

            forwardButton.addEventListener(
                "click",
                goForward
            );

            /*
             * Bouton − : replier toutes les entrées.
             */
            $("collapseAll").addEventListener(
                "click",
                collapseAllOutline
            );

            /*
             * Bouton + : déplier toutes les entrées.
             */
            $("expandAll").addEventListener(
                "click",
                expandAllOutline
            );

            /*
             * Navigation directe vers une page.
             */

            currentPageInput.addEventListener(
                "change",
                () => {
                    goToPage(
                        Number(currentPageInput.value)
                    );
                }
            );

            currentPageInput.addEventListener(
                "keydown",
                event => {
                    if (event.key === "Enter") {
                        goToPage(
                            Number(currentPageInput.value)
                        );

                        currentPageInput.blur();
                    }
                }
            );

            /*
             * Zoom.
             */

            $("zoomIn").addEventListener(
                "click",
                () => changeZoom(SCALE_STEP)
            );

            $("zoomOut").addEventListener(
                "click",
                () => changeZoom(-SCALE_STEP)
            );

            setupPinchZoom();

            zoomLevelInput.addEventListener(
                "change",
                applyManualZoom
            );

            zoomLevelInput.addEventListener(
                "keydown",
                event => {
                    if (event.key === "Enter") {
                        event.preventDefault();

                        applyManualZoom();

                        zoomLevelInput.blur();
                    }

                    if (event.key === "Escape") {
                        zoomLevelInput.value =
                            Math.round(scale * 100);

                        zoomLevelInput.blur();
                    }
                }
            );

            $("fitWidth").addEventListener(
                "click",
                fitPageWidth
            );

            /*
             * Recherche.
             */

            $("toggleSearch").addEventListener(
                "click",
                openSearch
            );

            $("closeSearch").addEventListener(
                "click",
                closeSearch
            );

            $("searchNext").addEventListener(
                "click",
                () => navigateSearch(1)
            );

            $("searchPrevious").addEventListener(
                "click",
                () => navigateSearch(-1)
            );

            searchInput.addEventListener(
                "input",
                scheduleSearch
            );

            matchCaseCheckbox.addEventListener(
                "change",
                scheduleSearch
            );

            wholeWordCheckbox.addEventListener(
                "change",
                scheduleSearch
            );

            searchInput.addEventListener(
                "keydown",
                event => {
                    if (event.key === "Enter") {
                        event.preventDefault();

                        navigateSearch(
                            event.shiftKey ? -1 : 1
                        );
                    }

                    if (event.key === "Escape") {
                        event.preventDefault();
                        closeSearch();
                    }
                }
            );

            /*
             * Ctrl+F / Cmd+F.
             */

            document.addEventListener(
                "keydown",
                event => {
                    const isFindShortcut =
                        (event.ctrlKey || event.metaKey) &&
                        event.key.toLowerCase() === "f";

                    if (isFindShortcut) {
                        event.preventDefault();
                        openSearch();
                        return;
                    }

                    if (
                        event.key === "Escape" &&
                        searchbar.classList.contains("visible")
                    ) {
                        closeSearch();
                    }
                }
            );

            /*
             * Le Ctrl+C reste géré nativement par le navigateur.
             *
             * Nous ne bloquons ni l'événement copy, ni les
             * événements de sélection du texte.
             */

            container.addEventListener(
                "scroll",
                scheduleViewportUpdate,
                { passive: true }
            );

            /*
             * Redimensionnement de la fenêtre.
             */

            window.addEventListener(
                "resize",
                () => {
                    clearTimeout(resizeTimer);

                    resizeTimer = setTimeout(() => {
                        if (!pdfDoc) return;

                        scheduleViewportUpdate();

                        const rect =
                            getContainerRect();

                        for (const info of pages) {
                            const pageRect =
                                info.shell.getBoundingClientRect();

                            const nearby =
                                pageRect.bottom >= rect.top - 500 &&
                                pageRect.top <= rect.bottom + 500;

                            if (
                                nearby &&
                                !info.rendered
                            ) {
                                requestRender(info, 100);
                            }
                        }
                    }, 150);
                }
            );
        }

        // =========================================
        // DÉMARRAGE
        // =========================================

        initialize();

        // =========================================
        // NETTOYAGE
        // =========================================

        window.addEventListener(
            "beforeunload",
            () => {
                destroyed = true;

                clearTimeout(searchTimer);
                clearTimeout(resizeTimer);
                clearTimeout(stateSyncTimer);

                if (pageObserver) {
                    pageObserver.disconnect();
                }

                if (scrollFrame !== null) {
                    cancelAnimationFrame(scrollFrame);
                }

                for (const info of pages) {
                    if (info.renderTask) {
                        try {
                            info.renderTask.cancel();
                        } catch (_) {}
                    }

                    if (info.textLayerTask) {
                        try {
                            info.textLayerTask.cancel();
                        } catch (_) {}
                    }
                }

                if (pdfDoc) {
                    pdfDoc.destroy();
                }
            }
        );

    })();
    </script>

    <script>
    /*
     * Full screen (F11, or the Fullscreen API): the toolbar hides itself,
     * and shows again when the reader scrolls up (also on a tablet), or
     * when the pointer comes near the top of the screen. It stays while
     * it is used (pointer over it, focus in it) or while searching.
     *
     * Full screen or narrow screen: the index goes over the document,
     * hidden; shown by its button, or in full screen when the pointer
     * comes near the left side of the screen; hidden again when an entry
     * is chosen, by a tap or a click out of it, Escape, or when the
     * pointer which showed it goes away.
     */
    (() => {
        "use strict";

        const body = document.body;
        const toolbar = document.getElementById("toolbar");
        const searchbar = document.getElementById("searchbar");
        const container = document.getElementById("pdf-container");

        // pointer closer to the top than this: the toolbar shows (px)
        const REVEAL_ZONE = 40;
        // scrolled by more than this: the toolbar shows or hides (px)
        const SCROLL_STEP = 40;
        // delay before hiding, after entering full screen or leaving the toolbar (ms)
        const HIDE_DELAY = 1200;

        let lastScrollTop = container.scrollTop;
        let hideTimer = null;
        // shown by the pointer: hidden again when it goes away
        let shownByPointer = false;

        const sidebar = document.getElementById("sidebar");
        const sidebarButton = document.getElementById("toggleSidebar");
        // narrower than this: the index over the document
        const narrow = window.matchMedia("(max-width: 900px)");
        let sidebarTimer = null;
        let sidebarByPointer = false;

        function updateSidebar() {
            const overlay = narrow.matches || body.classList.contains("fullscreen");
            if (overlay !== body.classList.contains("sidebar-overlay")) {
                body.classList.toggle("sidebar-overlay", overlay);
                closeSidebar();
            }
        }

        function openSidebar(byPointer = false) {
            clearTimeout(sidebarTimer);
            sidebarByPointer = byPointer;
            body.classList.add("sidebar-open");
        }

        function closeSidebar() {
            clearTimeout(sidebarTimer);
            sidebarTimer = null;
            sidebarByPointer = false;
            body.classList.remove("sidebar-open");
        }

        function sidebarOpen() {
            return body.classList.contains("sidebar-overlay")
                && body.classList.contains("sidebar-open");
        }

        // an entry chosen: the page is shown
        sidebar.addEventListener("click", event => {
            if (sidebarOpen() && event.target.closest(".outline-link")) {
                closeSidebar();
            }
        });

        // a tap or a click out of it (its button toggles it)
        document.addEventListener("pointerdown", event => {
            if (sidebarOpen() && !sidebar.contains(event.target)
                    && !sidebarButton.contains(event.target)) {
                closeSidebar();
            }
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && sidebarOpen()) {
                closeSidebar();
            }
        });

        narrow.addEventListener("change", updateSidebar);

        // Touch screen (a tablet, a phone): a button to go full screen, the
        // bar of the browser hidden (a computer has F11; nothing where the
        // Fullscreen API is missing, e.g. an iPhone)
        const fullscreenButton = document.getElementById("toggleFullscreen");

        if (document.fullscreenEnabled
                && window.matchMedia("(pointer: coarse)").matches) {
            fullscreenButton.hidden = false;

            fullscreenButton.addEventListener("click", () => {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement
                        .requestFullscreen({ navigationUI: "hide" })
                        .catch(() => {});
                }
            });

            document.addEventListener("fullscreenchange", () => {
                fullscreenButton.title = document.fullscreenElement
                    ? "Quitter le plein écran"
                    : "Plein écran";
            });
        }

        function isFullscreen() {
            // F11 is not seen by the Fullscreen API: the window then fills
            // the screen
            return Boolean(document.fullscreenElement)
                || window.matchMedia("(display-mode: fullscreen)").matches
                || (window.innerHeight >= screen.height - 1
                    && window.innerWidth >= screen.width - 1);
        }

        function inUse() {
            return toolbar.matches(":hover, :focus-within")
                || searchbar.classList.contains("visible");
        }

        function show(byPointer = false) {
            clearTimeout(hideTimer);
            shownByPointer = byPointer;
            body.classList.remove("toolbar-hidden");
        }

        function hide() {
            clearTimeout(hideTimer);
            hideTimer = null;
            if (body.classList.contains("fullscreen") && !inUse()) {
                body.classList.add("toolbar-hidden");
                shownByPointer = false;
            }
        }

        function hideLater() {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                hideTimer = null;
                hide();
            }, HIDE_DELAY);
        }

        function update() {
            const fullscreen = isFullscreen();
            if (fullscreen === body.classList.contains("fullscreen")) {
                return;
            }
            body.classList.toggle("fullscreen", fullscreen);
            if (fullscreen) {
                hideLater();
            } else {
                show();
            }
            updateSidebar();
        }

        // the search bar goes under the toolbar, as high as it
        new ResizeObserver(() => {
            body.style.setProperty("--toolbar-height", toolbar.offsetHeight + "px");
        }).observe(toolbar);

        window.addEventListener("resize", update);
        document.addEventListener("fullscreenchange", update);

        container.addEventListener("scroll", () => {
            const top = container.scrollTop;
            const delta = top - lastScrollTop;
            if (Math.abs(delta) < SCROLL_STEP) {
                return;
            }
            lastScrollTop = top;
            if (body.classList.contains("fullscreen")) {
                if (delta < 0) {
                    show();
                } else {
                    hide();
                }
            }
        }, { passive: true });

        // (the toolbar comes under a still pointer: no mouseenter nor
        // mouseleave, the distance to the top of the screen is used)
        document.addEventListener("mousemove", event => {
            if (!body.classList.contains("fullscreen")) {
                return;
            }
            // the index, from the left side of the screen
            if (!sidebarOpen()) {
                if (event.clientX <= REVEAL_ZONE && event.clientY > toolbar.offsetHeight) {
                    openSidebar(true);
                }
            } else if (sidebarByPointer) {
                if (event.clientX > sidebar.offsetWidth + REVEAL_ZONE) {
                    if (!sidebarTimer) {
                        sidebarTimer = setTimeout(closeSidebar, HIDE_DELAY);
                    }
                } else {
                    clearTimeout(sidebarTimer);
                    sidebarTimer = null;
                }
            }
            if (body.classList.contains("toolbar-hidden")) {
                if (event.clientY <= REVEAL_ZONE) {
                    show(true);
                }
            } else if (shownByPointer) {
                if (event.clientY > toolbar.offsetHeight + REVEAL_ZONE) {
                    if (!hideTimer) {
                        hideLater();
                    }
                } else {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
            }
        });

        update();
        updateSidebar();
    })();
    </script>
    <script>
    /*
     * MOCKUP: notes in the margin.
     *
     * A click in the margin (right of the document) opens a bubble, anchored
     * to the page and the height of the click in it (or of the selected
     * text, quoted in the note): the note follows the document (scroll,
     * zoom). The bubbles are moved down so as not to overlap. Two buttons
     * go to the previous / next note. The notes are those of the logged in
     * user, saved by the server (userdata.db, PUT /api/notes/<sha1>), 500
     * ms after a change; a copy is kept in this browser (localStorage) while
     * the server can not save them, sent at the next opening.
     */
    (() => {
        "use strict";

        const DOCUMENT_ID = {{ documentId | tojson }};
        const STORE_KEY = "ebookonline.notes." + DOCUMENT_ID;
        const NOTES_URL = {{ url_for('api.get_notes', sha1=documentId) | tojson }};
        const NOTES_TOKEN = {{ notes_token | tojson }};
        // delay of the saving, after a change (ms)
        const SAVE_DELAY = 500;
        const SHOWN_KEY = "ebookonline.notes.shown";
        // space between two bubbles; the tail is this far below their top (px)
        const GAP = 8;
        const TAIL = 17;
        // longest quotation of the selected text, in characters
        const MAX_QUOTE = 256;

        const workspace = document.getElementById("workspace");
        const container = document.getElementById("pdf-container");
        const margin = document.getElementById("notes");
        const layer = document.getElementById("notes-layer");
        const toggle = document.getElementById("toggleNotes");
        const previousButton = document.getElementById("previousNote");
        const nextButton = document.getElementById("nextNote");

        // [{id, page, ratio (height in the page, 0..1), quote (selected
        // text, or empty), text}]
        let notes = [];

        // a note with a quotation, or a text
        function filled(note) {
            return Boolean(note.quote || note.text.trim());
        }

        // the notes to save: those with a quotation or a text
        function payload() {
            return notes.filter(filled).map(({ id, page, ratio, quote, text }) =>
                ({ id: String(id), page, ratio, quote, text }));
        }

        function localCopy() {
            try {
                return JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
            } catch (_) {
                return [];
            }
        }

        // the notes of the server; those of this browser not saved yet
        // (not sent, or of the mockup) win, and are sent
        async function load() {
            const local = localCopy();
            let saved;
            try {
                const response = await fetch(NOTES_URL, { credentials: "same-origin" });
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                saved = (await response.json()).notes;
            } catch (error) {
                console.warn("Notes du serveur indisponibles :", error);
                return local;
            }
            if (!local.length) {
                return saved;
            }
            const ids = new Set(local.map(n => String(n.id)));
            return saved.filter(n => !ids.has(String(n.id))).concat(local);
        }

        async function send(keepalive = false) {
            try {
                const response = await fetch(NOTES_URL, {
                    method: "PUT",
                    credentials: "same-origin",
                    keepalive,
                    headers: { "Content-Type": "application/json", "X-CSRFToken": NOTES_TOKEN },
                    body: JSON.stringify({ notes: payload() })
                });
                if (!response.ok) {
                    throw new Error((await response.json().catch(() => ({}))).error
                                    || "HTTP " + response.status);
                }
                try {
                    localStorage.removeItem(STORE_KEY);
                } catch (_) {}
                return true;
            } catch (error) {
                console.warn("Notes non enregistrées sur le serveur :", error);
                // kept in this browser, sent at the next opening
                try {
                    localStorage.setItem(STORE_KEY, JSON.stringify(payload()));
                } catch (_) {}
                return false;
            }
        }

        let saveTimer = null;
        function save() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                saveTimer = null;
                send();
            }, SAVE_DELAY);
        }

        // leaving the page: the change not sent yet
        window.addEventListener("pagehide", () => {
            if (saveTimer) {
                clearTimeout(saveTimer);
                saveTimer = null;
                send(true);
            }
        });

        // --- positions, in the coordinates of the scrolled document
        function documentY(clientY) {
            return clientY - container.getBoundingClientRect().top + container.scrollTop;
        }

        function documentTop(element) {
            return documentY(element.getBoundingClientRect().top);
        }

        function shell(page) {
            return container.querySelector(`.pdf-page[data-page-number="${page}"]`);
        }

        // the anchor of a point at clientY: the page under it (or the
        // closest one), and the height in this page
        function anchorAt(clientY) {
            const y = documentY(clientY);
            let best = null;
            for (const page of container.querySelectorAll(".pdf-page")) {
                const top = documentTop(page);
                const bottom = top + page.offsetHeight;
                const distance = y < top ? top - y : (y > bottom ? y - bottom : 0);
                if (!best || distance < best.distance) {
                    best = { distance, page: Number(page.dataset.pageNumber),
                             ratio: Math.min(1, Math.max(0, (y - top) / page.offsetHeight)) };
                }
                if (distance === 0) {
                    break;
                }
            }
            return best;
        }

        function anchorY(note) {
            const page = shell(note.page);
            return page ? documentTop(page) + note.ratio * page.offsetHeight : null;
        }

        // --- the selected text of the document, quoted in a new note
        function selectedQuote() {
            const selection = window.getSelection();
            if (!selection || selection.isCollapsed || !selection.rangeCount) {
                return null;
            }
            const range = selection.getRangeAt(0);
            const node = range.commonAncestorContainer;
            const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
            // in the document only, not in a note
            if (!container.contains(element) || margin.contains(element)) {
                return null;
            }
            let text = selection.toString().replace(/\s+/g, " ").trim();
            if (!text) {
                return null;
            }
            if (text.length > MAX_QUOTE) {
                text = text.slice(0, MAX_QUOTE - 1).trimEnd() + "…";
            }
            return { text, clientY: range.getBoundingClientRect().top };
        }

        // --- the bubbles
        function element(note) {
            const bubble = document.createElement("div");
            bubble.className = "note";
            bubble.innerHTML =
                '<div class="note-header">'
                + '<button type="button" class="note-page" title="Aller à ce passage"></button>'
                + '<button type="button" class="note-delete" title="Supprimer la note" aria-label="Supprimer la note">✕</button>'
                + '</div>'
                + (note.quote ? '<div class="note-quote"></div>' : '')
                + '<div class="note-text" spellcheck="true"></div>';
            bubble.querySelector(".note-page").textContent = "p. " + note.page;
            if (note.quote) {
                bubble.querySelector(".note-quote").textContent = `« ${note.quote} »`;
            }
            const text = bubble.querySelector(".note-text");
            try {
                // text only, no formatting
                text.contentEditable = "plaintext-only";
            } catch (_) {
                // (older browsers)
                text.contentEditable = "true";
            }
            text.textContent = note.text;
            text.addEventListener("input", () => {
                note.text = text.innerText;
                save();
                layout();
            });
            text.addEventListener("keydown", event => {
                if (event.key === "Escape") {
                    text.blur();
                }
                // (the keys of the reader, e.g. Ctrl+F, are not for the note)
                event.stopPropagation();
            });
            text.addEventListener("blur", () => {
                // an empty note is dropped
                if (!filled(note)) {
                    remove(note);
                }
            });
            bubble.querySelector(".note-page").addEventListener("click", () => goTo(note));
            bubble.querySelector(".note-delete").addEventListener("click", () => remove(note));

            const anchor = document.createElement("div");
            anchor.className = "note-anchor";
            const link = document.createElement("div");
            link.className = "note-link";
            layer.append(link, anchor, bubble);
            note.elements = { bubble, anchor, link, text };
        }

        function remove(note) {
            notes = notes.filter(n => n !== note);
            for (const e of ["bubble", "anchor", "link"]) {
                note.elements[e].remove();
            }
            save();
            layout();
        }

        // the bubbles in the order of their anchors, each one under the
        // previous one when they would overlap; the margin as high as the
        // document (or the last bubble)
        // a note is shown once its page was drawn (a canvas in it), then
        // stays shown (also while its page is drawn again: zoom)
        function seen(note) {
            if (!note.seen) {
                const page = shell(note.page);
                note.seen = Boolean(page && page.querySelector("canvas"));
            }
            return note.seen;
        }

        function layout() {
            margin.classList.toggle("has-notes", notes.length > 0);
            const pages = container.querySelectorAll(".pdf-page");
            const last = pages[pages.length - 1];
            let height = last ? documentTop(last) + last.offsetHeight : container.clientHeight;
            let bottom = -Infinity;
            const placed = [];
            for (const note of notes) {
                const y = seen(note) ? anchorY(note) : null;
                for (const e of ["bubble", "anchor", "link"]) {
                    note.elements[e].classList.toggle("unseen", y === null);
                }
                if (y !== null) {
                    placed.push({ note, y });
                }
            }
            placed.sort((a, b) => a.y - b.y);
            for (const { note, y } of placed) {
                const { bubble, anchor, link } = note.elements;
                const top = Math.max(y - TAIL, bottom + GAP);
                bubble.style.top = top + "px";
                anchor.style.top = y + "px";
                link.style.top = y + "px";
                link.style.height = Math.max(0, top + TAIL - y) + "px";
                bottom = top + bubble.offsetHeight;
            }
            margin.style.height = Math.max(height, bottom + GAP) + "px";
            // the buttons left of the scrollbar
            workspace.style.setProperty("--scrollbar-width",
                (container.offsetWidth - container.clientWidth) + "px");
            updateButtons();
        }

        // --- to the previous / next note
        // the reading position: a third of the view (where a note goes)
        function readingY() {
            return container.scrollTop + container.clientHeight / 3;
        }

        function sortedNotes() {
            return notes
                .map(note => ({ note, y: anchorY(note) }))
                .filter(p => p.y !== null && filled(p.note))
                .sort((a, b) => a.y - b.y);
        }

        function neighbour(direction) {
            const y = readingY();
            const sorted = sortedNotes();
            if (direction < 0) {
                return sorted.filter(p => p.y < y - 2).pop();
            }
            return sorted.find(p => p.y > y + 2);
        }

        function updateButtons() {
            previousButton.disabled = !neighbour(-1);
            nextButton.disabled = !neighbour(1);
        }

        function goTo(note) {
            const y = anchorY(note);
            if (y === null) {
                return;
            }
            container.scrollTo({ top: Math.max(0, y - container.clientHeight / 3), behavior: "smooth" });
            const bubble = note.elements.bubble;
            bubble.classList.add("reached");
            setTimeout(() => bubble.classList.remove("reached"), 1200);
        }

        previousButton.addEventListener("click", () => {
            const p = neighbour(-1);
            if (p) {
                goTo(p.note);
            }
        });

        nextButton.addEventListener("click", () => {
            const p = neighbour(1);
            if (p) {
                goTo(p.note);
            }
        });

        // --- a new note
        // (the selection is read when the button is pressed: the click
        // then clears it)
        let quote = null;
        margin.addEventListener("pointerdown", event => {
            quote = event.target === margin || event.target === layer ? selectedQuote() : null;
        });

        margin.addEventListener("click", event => {
            if (event.target !== margin && event.target !== layer) {
                return;
            }
            // anchored to the selected text, or to the click
            const anchor = anchorAt(quote ? quote.clientY : event.clientY);
            if (!anchor) {
                return;
            }
            const note = { id: "n-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                           page: anchor.page, ratio: anchor.ratio,
                           quote: quote ? quote.text : "", text: "" };
            quote = null;
            notes.push(note);
            element(note);
            layout();
            save();
            // (the cursor in the text, under the quotation)
            note.elements.text.focus();
        });

        // zoom, window size, pages rendered: the pages change of size,
        // the bubbles are placed again (once per frame at most)
        let pending = false;
        function layoutSoon() {
            if (!pending) {
                pending = true;
                requestAnimationFrame(() => {
                    pending = false;
                    layout();
                });
            }
        }

        container.addEventListener("scroll", () => requestAnimationFrame(updateButtons), { passive: true });
        new ResizeObserver(layoutSoon).observe(container);
        // (the changes of the bubbles themselves are not of the pages)
        new MutationObserver(mutations => {
            if (mutations.some(m => !margin.contains(m.target))) {
                layoutSoon();
            }
        }).observe(container, { subtree: true, childList: true,
                                attributes: true, attributeFilter: ["style"] });

        function show(shown) {
            workspace.classList.toggle("notes-hidden", !shown);
            toggle.setAttribute("aria-pressed", String(shown));
            try {
                localStorage.setItem(SHOWN_KEY, shown ? "1" : "0");
            } catch (_) {}
            layoutSoon();
        }

        toggle.addEventListener("click", () => {
            show(workspace.classList.contains("notes-hidden"));
        });

        // (the notes made meanwhile are kept)
        load().then(loaded => {
            const made = notes;
            notes = loaded;
            notes.forEach(element);
            notes.push(...made);
            layoutSoon();
            if (localCopy().length) {
                send();
            }
        });
        let shown = true;
        try {
            shown = localStorage.getItem(SHOWN_KEY) !== "0";
        } catch (_) {}
        show(shown);
    })();
    </script>
</body>
