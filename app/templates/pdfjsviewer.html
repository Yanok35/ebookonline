                pageNumber < 1 ||
                pageNumber > pdfDoc.numPages
            ) {
                currentPageInput.value =
                    currentPageNumber;

                return;
            }

            const info = pages[pageNumber - 1];

            currentPageNumber = pageNumber;
            currentPageInput.value = pageNumber;

            await loadPageMetadata(info);

            updateShellSize(info);

            const containerRect =
                getContainerRect();

            const pageRect =
                info.shell.getBoundingClientRect();

            const target =
                container.scrollTop +
                pageRect.top -
                containerRect.top;

            container.scrollTo({
                top: target,
                behavior: "auto"
            });

            requestRender(info, 1000);

            scheduleViewportUpdate();
        }

        // =========================================
        // ZOOM
        // =========================================

        async function changeZoom(delta) {
            if (!pdfDoc) return;

            const newScale = clamp(
                Math.round(
                    (scale + delta) * 100
                ) / 100,
                MIN_SCALE,
                MAX_SCALE
            );

            if (newScale === scale) return;

            await setZoom(newScale);
        }

        async function applyManualZoom() {
            if (!pdfDoc) return;

            let percentage =
                Number(zoomLevelInput.value);

            if (!Number.isFinite(percentage)) {
                zoomLevelInput.value =
                    Math.round(scale * 100);

                return;
            }

            percentage = clamp(
                percentage,
                MIN_SCALE * 100,
                MAX_SCALE * 100
            );

            percentage = Math.round(percentage);

            zoomLevelInput.value = percentage;

            await setZoom(percentage / 100);
        }

        async function fitPageWidth() {
            if (!pdfDoc || !pages.length) return;

            try {
                const referencePage = pages[0];

                await loadPageMetadata(referencePage);

                const availableWidth =
                    container.clientWidth - 24;

                if (availableWidth <= 0) return;

                const newScale =
                    availableWidth /
                    referencePage.widthAtScale1;

                await setZoom(
                    clamp(
                        newScale,
                        MIN_SCALE,
                        MAX_SCALE
                    )
                );

            } catch (error) {
                console.error(
                    "Impossible d'adapter la largeur :",
                    error
                );
            }
        }

        async function setZoom(
            newScale,
            preservePosition = true
        ) {
            if (!pdfDoc) return;

            newScale = clamp(
                newScale,
                MIN_SCALE,
                MAX_SCALE
            );

            if (
                Math.abs(newScale - scale) < 0.001
            ) {
                zoomLevelInput.value =
                    Math.round(scale * 100);

                return;
            }

            const anchorNumber = findCurrentPage();
            const anchor = pages[anchorNumber - 1];

            const oldContainerRect =
                getContainerRect();

            const oldPageRect =
                anchor.shell.getBoundingClientRect();

            const oldOffset =
                oldPageRect.top -
                oldContainerRect.top;

            scale = newScale;

            zoomLevelInput.value =
                Math.round(scale * 100);

            /*
             * Invalider les rendus précédents.
             *
             * Les caches textuels restent disponibles,
             * mais les couches visuelles sont reconstruites.
             */

            for (const info of pages) {
                if (info.renderTask) {
                    try {
                        info.renderTask.cancel();
                    } catch (_) {}
                }

                if (info.textLayerTask) {
                    try {
                        info.textLayerTask.cancel();
                    } catch (_) {}
                }

                info.generation++;

                info.renderTask = null;
                info.textLayerTask = null;
                info.rendering = false;

                if (info.canvas) {
                    info.canvas.width = 0;
                    info.canvas.height = 0;

                    info.canvas = null;
                    info.rendered = false;

                    cachedCanvasCount--;
                }

                if (info.textLayer) {
                    info.textLayer.remove();
                    info.textLayer = null;
                }

                if (info.linksLayer) {
                    info.linksLayer.remove();
                    info.linksLayer = null;
                }

                if (info.highlightLayer) {
                    info.highlightLayer.remove();
                    info.highlightLayer = null;
                }

                info.shell.replaceChildren();

                const placeholder =
                    document.createElement("div");

                placeholder.className =
                    "page-placeholder";

                placeholder.textContent =
                    "Page " + info.pageNumber;

                info.shell.appendChild(placeholder);

                updateShellSize(info);
            }

            cachedCanvasCount = Math.max(
                0,
                cachedCanvasCount
            );

            renderQueue.length = 0;
            queuedPages.clear();

            if (preservePosition) {
                const newContainerRect =
                    getContainerRect();

                const newPageRect =
                    anchor.shell.getBoundingClientRect();

                container.scrollTop +=
                    newPageRect.top -
                    newContainerRect.top -
                    oldOffset;
            }

            requestRender(anchor, 1000);

            scheduleViewportUpdate();
        }

        // =========================================
        // COMMANDES ET RACCOURCIS
        // =========================================

        function setupControls() {

            $("toggleSidebar").addEventListener(
                "click",
                () => {
                    workspace.classList.toggle(
                        "sidebar-hidden"
                    );

                    setTimeout(
                        scheduleViewportUpdate,
                        180
                    );
                }
            );

            /*
             * Navigation dans l'historique.
             */

            backButton.addEventListener(
                "click",
                goBack
            );

            forwardButton.addEventListener(
                "click",
                goForward
            );

            /*
             * Bouton − : replier toutes les entrées.
             */
            $("collapseAll").addEventListener(
                "click",
                collapseAllOutline
            );

            /*
             * Bouton + : déplier toutes les entrées.
             */
            $("expandAll").addEventListener(
                "click",
                expandAllOutline
            );

            /*
             * Navigation directe vers une page.
             */

            currentPageInput.addEventListener(
                "change",
                () => {
                    goToPage(
                        Number(currentPageInput.value)
                    );
                }
            );

            currentPageInput.addEventListener(
                "keydown",
                event => {
                    if (event.key === "Enter") {
                        goToPage(
                            Number(currentPageInput.value)
                        );

                        currentPageInput.blur();
                    }
                }
            );

            /*
             * Zoom.
             */

            $("zoomIn").addEventListener(
                "click",
                () => changeZoom(SCALE_STEP)
            );

            $("zoomOut").addEventListener(
                "click",
                () => changeZoom(-SCALE_STEP)
            );

            zoomLevelInput.addEventListener(
                "change",
                applyManualZoom
            );

            zoomLevelInput.addEventListener(
                "keydown",
                event => {
                    if (event.key === "Enter") {
                        event.preventDefault();

                        applyManualZoom();

                        zoomLevelInput.blur();
                    }

                    if (event.key === "Escape") {
                        zoomLevelInput.value =
                            Math.round(scale * 100);

                        zoomLevelInput.blur();
                    }
                }
            );

            $("fitWidth").addEventListener(
                "click",
                fitPageWidth
            );

            /*
             * Recherche.
             */

            $("toggleSearch").addEventListener(
                "click",
                openSearch
            );

            $("closeSearch").addEventListener(
                "click",
                closeSearch
            );

            $("searchNext").addEventListener(
                "click",
                () => navigateSearch(1)
            );

            $("searchPrevious").addEventListener(
                "click",
                () => navigateSearch(-1)
            );

            searchInput.addEventListener(
                "input",
                scheduleSearch
            );

            matchCaseCheckbox.addEventListener(
                "change",
                scheduleSearch
            );

            wholeWordCheckbox.addEventListener(
                "change",
                scheduleSearch
            );

            searchInput.addEventListener(
                "keydown",
                event => {
                    if (event.key === "Enter") {
                        event.preventDefault();

                        navigateSearch(
                            event.shiftKey ? -1 : 1
                        );
                    }

                    if (event.key === "Escape") {
                        event.preventDefault();
                        closeSearch();
                    }
                }
            );

            /*
             * Ctrl+F / Cmd+F.
             */

            document.addEventListener(
                "keydown",
                event => {
                    const isFindShortcut =
                        (event.ctrlKey || event.metaKey) &&
                        event.key.toLowerCase() === "f";

                    if (isFindShortcut) {
                        event.preventDefault();
                        openSearch();
                        return;
                    }

                    if (
                        event.key === "Escape" &&
                        searchbar.classList.contains("visible")
                    ) {
                        closeSearch();
                    }
                }
            );

            /*
             * Le Ctrl+C reste géré nativement par le navigateur.
             *
             * Nous ne bloquons ni l'événement copy, ni les
             * événements de sélection du texte.
             */

            container.addEventListener(
                "scroll",
                scheduleViewportUpdate,
                { passive: true }
            );

            /*
             * Redimensionnement de la fenêtre.
             */

            window.addEventListener(
                "resize",
                () => {
                    clearTimeout(resizeTimer);

                    resizeTimer = setTimeout(() => {
                        if (!pdfDoc) return;

                        scheduleViewportUpdate();

                        const rect =
                            getContainerRect();

                        for (const info of pages) {
                            const pageRect =
                                info.shell.getBoundingClientRect();

                            const nearby =
                                pageRect.bottom >= rect.top - 500 &&
                                pageRect.top <= rect.bottom + 500;

                            if (
                                nearby &&
                                !info.rendered
                            ) {
                                requestRender(info, 100);
                            }
                        }
                    }, 150);
                }
            );
        }

        // =========================================
        // DÉMARRAGE
        // =========================================

        initialize();

        // =========================================
        // NETTOYAGE
        // =========================================

        window.addEventListener(
            "beforeunload",
            () => {
                destroyed = true;

                clearTimeout(searchTimer);
                clearTimeout(resizeTimer);

                if (pageObserver) {
                    pageObserver.disconnect();
                }

                if (scrollFrame !== null) {
                    cancelAnimationFrame(scrollFrame);
                }

                for (const info of pages) {
                    if (info.renderTask) {
                        try {
                            info.renderTask.cancel();
                        } catch (_) {}
                    }

                    if (info.textLayerTask) {
                        try {
                            info.textLayerTask.cancel();
                        } catch (_) {}
                    }
                }

                if (pdfDoc) {
                    pdfDoc.destroy();
                }
            }
        );

    })();
    </script>

</body>
</html>
