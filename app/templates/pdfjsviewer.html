<!DOCTYPE html>
<html lang="fr"{% if config.READER_THEME == "light" %} class="light"{% endif %}>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ titre }}</title>

    <!-- PDF.js -->
    <script src="{{ url_for('static', filename='libs/pdf.min_3.11.174.js')}}"></script>

    <!-- Feuille de style officielle de PDF.js pour la couche de texte -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='libs/pdf_viewer.min_3.11.174.css')}}"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* the font of the site */
            font-family: serif;
            color: #222;
            background: #574e45;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: .45;
            cursor: default;
        }

        /* Palette: warm dark browns for the toolbar and the background of
           the pages, the beiges of the site (static/style.css) for the
           outline and the search bar, golden active entry */

        /* =====================================
           BARRE D'OUTILS
           ===================================== */

        /* The home link, as high as the two lines on its right: the title
           of the document, centred, above the tools */
        #toolbar {
            display: flex;
            align-items: stretch;
            gap: 10px;
            padding: 5px 9px 7px;
            color: white;
            background: #362f29;
            z-index: 10;
        }

        #toolbar-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        #toolbar-title {
            text-align: center;
            line-height: 1.3;
            min-width: 0;
        }

        #docName {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #e9e6e2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* the texts of the tools as large as the title */
        #toolbar-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 30px;
            font-size: 14px;
        }

        /* Full screen (F11, or the Fullscreen API): the toolbar is over the
           document, hidden until the reader scrolls up, or the pointer
           comes near the top of the screen */
        body.fullscreen #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            box-shadow: 0 2px 6px #0006;
            transition: transform 200ms ease, box-shadow 200ms ease;
        }

        body.fullscreen.toolbar-hidden #toolbar {
            transform: translateY(-100%);
            box-shadow: none;
        }

        /* the search bar under the toolbar (shown while searching) */
        body.fullscreen #searchbar.visible {
            margin-top: var(--toolbar-height, 0px);
        }

        @media (prefers-reduced-motion: reduce) {
            body.fullscreen #toolbar {
                transition: none;
            }
        }

        #filler {
            flex-grow: 1;
        }

        #homeLink {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            padding: 2px;
            border-radius: 3px;
        }

        #homeLink:hover,
        #homeLink:focus-visible {
            background: #5c5044;
        }

        /* (the icon is 46 px: not larger) */
        #homeLink img {
            display: block;
            height: 100%;
            max-height: 46px;
            width: auto;
        }

        #toolbar button {
            padding: 0 9px;
            border: 1px solid #8a7b69;
            border-radius: 3px;
            background: #4a4037;
            color: white;
        }

        #toolbar button:hover:not(:disabled) {
            background: #5c5044;
        }

        /* The rectangular buttons and the fields, as high as each other
           (an emoji is taller than a letter: centred, not higher) */
        #toolbar button:not(.round),
        #currentPage,
        #zoomLevel {
            height: 28px;
        }

        #toolbar button:not(.round) {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* a button not available here (the full screen one on a computer) */
        #toolbar button[hidden] {
            display: none;
        }

        /* The groups of tools (page, zoom, search and points of view):
           more space between them than in them */
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* the groups as far apart from each other: the space left is
           shared between them */
        #toolbar-row {
            justify-content: space-between;
            column-gap: 32px;
        }

        /* Round buttons with an icon (search, previous / next point of
           view): the label in their tooltip */
        #toolbar button.round {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            font-size: 13px;
            line-height: 1;
            box-shadow: 0 2px 6px #0006;
        }

        #toolbar button.round:disabled {
            box-shadow: none;
        }

        /* the fields as the buttons of the toolbar (dark theme) */
        #currentPage,
        #zoomLevel {
            padding: 0 6px;
            text-align: center;
            border: 1px solid #8a7b69;
            border-radius: 3px;
            background: #4a4037;
            color: white;
            caret-color: white;
        }

        #currentPage:focus,
        #zoomLevel:focus {
            outline: 1px solid #e9e6e2;
        }

        #currentPage:disabled,
        #zoomLevel:disabled {
            opacity: .45;
        }

        #currentPage {
            width: 65px;
        }

        #zoomLevel {
            width: 70px;
        }

        #pageCount {
            white-space: nowrap;
        }

        /* the labels in small caps, as the links of the site */
        #toolbar label,
        #pageCount,
        #status {
            font-variant: small-caps;
        }

        /* the group of the status: shrinks when the line is full */
        #infoGroup {
            flex: 0 1 auto;
            min-width: 0;
        }

        /* The status (page position) next to the download button; shrinks
           when the line is full */
        #docInfo {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 1 auto;
            min-width: 50px;
            max-width: 100%;
        }

        /* wide screen: the tools on a single line, the status gets the
           space left */
        @media (min-width: 1100px) {
            #toolbar-row {
                flex-wrap: nowrap;
            }

            #toolbar-row > *:not(#infoGroup) {
                flex-shrink: 0;
                white-space: nowrap;
            }
        }

        #docInfo a,
        #docInfo > button {
            flex-shrink: 0;
        }

        #docText {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            min-width: 0;
        }

        #status {
            font-size: 12px;
            line-height: 1.2;
            color: #e9e6e2;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Metadata of the book not reviewed yet: link to its admin page */
        #reviewBadge {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 9px;
            border-radius: 12px;
            background: #b7791f;
            color: white;
            font-size: 12px;
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        #reviewBadge:hover,
        #reviewBadge:focus-visible {
            background: #d69e2e;
        }

        /* =====================================
           RECHERCHE
           ===================================== */

        /* the sizes of the toolbar: texts of 13 px, controls of 28 px */
        #searchbar {
            display: none;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
            padding: 6px 14px;
            font-size: 14px;
            background: #f4f2ef;
            border-bottom: 1px solid #c9c1b6;
            box-shadow: 0 2px 4px #0002;
            z-index: 9;
        }

        #searchbar.visible {
            display: flex;
        }

        #searchInput {
            flex: 1 1 220px;
            max-width: 460px;
            min-width: 120px;
            height: 28px;
            padding: 0 8px;
            border: 1px solid #aaa;
            border-radius: 3px;
        }

        #searchbar button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            padding: 0 9px;
            line-height: 1;
            border: 1px solid #c9c1b6;
            border-radius: 3px;
            background: white;
        }

        #searchbar button:hover {
            background: #efe6d6;
        }

        #searchbar label {
            font-size: 14px;
            font-variant: small-caps;
            white-space: nowrap;
        }

        #searchStatus {
            min-width: 110px;
            font-size: 14px;
            font-variant: small-caps;
            color: #444;
        }

        /* =====================================
           ESPACE DE TRAVAIL
           ===================================== */

        #workspace {
            display: flex;
            flex: 1;
            min-width: 0;
            min-height: 0;
        }

        /* =====================================
           INDEX / SIGNETS
           ===================================== */

        #sidebar {
            display: flex;
            flex-direction: column;
            flex: 0 0 300px;
            width: 300px;
            min-width: 0;
            overflow: hidden;
            background: #f4f2ef;
            border-right: 1px solid #c9c1b6;
        }

        #sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #e9e6e2;
            border-bottom: 1px solid #ddd5c9;
        }

        #sidebar-header h2 {
            margin: 0;
            font-size: 16px;
            font-variant: small-caps;
        }

        #sidebar-header button {
            padding: 4px 8px;
            border: 1px solid #c9c1b6;
            background: white;
        }

        #outline-container {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 8px 6px 20px;
        }

        .outline-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .outline-list .outline-list {
            margin-left: 12px;
            padding-left: 7px;
            border-left: 1px solid #ddd5c9;
        }

        .outline-item {
            margin: 2px 0;
        }

        .outline-row {
            display: flex;
            align-items: flex-start;
            gap: 3px;
            border-radius: 3px;
        }

        .outline-row:hover {
            background: #efe6d6;
        }

        .outline-row.active {
            background: #f9e3b0;
        }

        .outline-toggle {
            flex: 0 0 22px;
            width: 22px;
            height: 28px;
            padding: 0;
            border: 0;
            background: transparent;
        }

        .outline-toggle.empty {
            visibility: hidden;
        }

        .outline-link {
            display: flex;
            align-items: flex-start;
            flex: 1;
            min-width: 0;
            gap: 7px;
            padding: 6px 4px;
            border: 0;
            border-radius: 3px;
            background: transparent;
            color: #222;
            text-align: left;
            font-size: 15px;
            line-height: 1.35;
        }

        .outline-title {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .outline-page {
            flex: 0 0 auto;
            padding-top: 1px;
            color: #777;
            font-size: 14px;
        }

        .outline-children.collapsed {
            display: none;
        }

        #workspace.sidebar-hidden #sidebar {
            display: none;
        }

        /* Narrow screen, full screen: the index over the document (which
           keeps its width), hidden until asked, as the toolbar */
        body.sidebar-overlay #workspace {
            position: relative;
        }

        body.sidebar-overlay #sidebar,
        body.sidebar-overlay #workspace.sidebar-hidden #sidebar {
            display: flex;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 8;
            width: min(300px, 85vw);
            box-shadow: 2px 0 8px #0006;
            transform: translateX(-100%);
            visibility: hidden;
            transition: transform 200ms ease, visibility 0s linear 200ms;
        }

        body.sidebar-overlay.sidebar-open #sidebar {
            transform: none;
            visibility: visible;
            transition-delay: 0s;
        }

        @media (prefers-reduced-motion: reduce) {
            body.sidebar-overlay #sidebar {
                transition: none;
            }
        }

        /* =====================================
           NOTES EN MARGE (MOCKUP)
           ===================================== */

        /* The margin: as wide as the sidebar, transparent, in the scrolled
           container (its scrollbar on the right of the margin, the wheel
           over the margin scrolls the document); the notes are bubbles */
        #workspace {
            position: relative;
        }

        #pdf-container {
            position: relative;
        }

        #workspace:not(.notes-hidden) #pdf-container {
            padding-right: calc(var(--notes-width) + 12px);
        }

        :root {
            --notes-width: 300px;
        }

        #notes {
            position: absolute;
            top: 0;
            right: 0;
            width: var(--notes-width);
            cursor: copy;
        }

        #workspace.notes-hidden #notes,
        #workspace.notes-hidden #notes-nav {
            display: none;
        }

        #notes-hint {
            position: sticky;
            top: 24px;
            margin: 24px;
            color: #ffffff80;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
            pointer-events: none;
        }

        #notes.has-notes #notes-hint {
            display: none;
        }

        #notes-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        /* to the previous / next note: at the bottom right of the margin,
           left of the scrollbar */
        #notes-nav {
            position: absolute;
            bottom: 16px;
            right: calc(var(--scrollbar-width, 0px) + 14px);
            display: flex;
            gap: 8px;
            z-index: 5;
        }

        #notes-nav button {
            width: 36px;
            height: 36px;
            border: 1px solid #8a7b69;
            border-radius: 50%;
            background: #4a4037;
            color: white;
            font-size: 14px;
            box-shadow: 0 2px 6px #0006;
        }

        #notes-nav button:hover:not(:disabled) {
            background: #5c5044;
        }

        /* a note whose page is not drawn yet (the document loading): hidden,
           not on top of the margin */
        .note.unseen,
        .note-anchor.unseen,
        .note-link.unseen {
            display: none;
        }

        /* the note reached with the buttons */
        .note.reached {
            box-shadow: 0 0 0 3px #f5c86a, 0 2px 8px #0008;
        }

        .note-anchor {
            position: absolute;
            left: 2px;
            width: 9px;
            height: 9px;
            margin-top: -4px;
            border-radius: 50%;
            background: #f5c86a;
            box-shadow: 0 0 0 2px #52565980;
            pointer-events: none;
        }

        /* a line from the anchor to its bubble, when the bubble was moved
           down by the ones above */
        .note-link {
            position: absolute;
            left: 6px;
            width: 0;
            border-left: 1px dashed #f5c86acc;
            pointer-events: none;
        }

        /* a bubble, as in a comic strip: its tail points to the document */
        .note {
            position: absolute;
            left: 20px;
            right: 14px;
            padding: 6px 8px 8px;
            border-radius: 12px;
            background: #fffbe8;
            color: #222;
            box-shadow: 0 2px 6px #0006;
            cursor: auto;
            transition: box-shadow 150ms ease;
        }

        .note::before {
            content: "";
            position: absolute;
            top: 10px;
            left: -9px;
            border-style: solid;
            border-width: 7px 10px 7px 0;
            border-color: transparent #fffbe8 transparent transparent;
        }

        .note:focus-within {
            box-shadow: 0 0 0 2px #f5c86a, 0 2px 8px #0008;
        }

        .note-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            font-size: 11px;
            color: #8a6d3b;
        }

        .note-page {
            border: 0;
            padding: 0;
            background: transparent;
            color: inherit;
            font-size: inherit;
        }

        .note-page:hover {
            text-decoration: underline;
        }

        .note-delete {
            border: 0;
            padding: 0 2px;
            background: transparent;
            color: #999;
            font-size: 13px;
            line-height: 1;
        }

        .note-delete:hover {
            color: darkred;
        }

        /* the selected text of the document, quoted */
        .note-quote {
            margin: 2px 0 6px;
            padding-left: 7px;
            border-left: 3px solid #f5c86a;
            color: #555;
            font-size: 12px;
            font-style: italic;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .note-text {
            min-height: 1.4em;
            font-size: 13px;
            line-height: 1.4;
            outline: none;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .note-text:empty::before {
            content: "Votre note…";
            color: #aaa;
        }

        #toolbar button#toggleNotes[aria-pressed="true"] {
            background: #6b5a2e;
        }

        /* =====================================
           CONTENEUR DU PDF
           ===================================== */

        #pdf-container {
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: auto;
            overscroll-behavior: contain;
            /* touch screen: two fingers zoom the document (pinch, see
               setupPinchZoom()), not the whole page; scrolled as usual */
            touch-action: pan-x pan-y;
            padding: 20px 12px;
            background: #574e45;
            scrollbar-gutter: stable;
        }

        .pdf-page {
            position: relative;
            margin: 0 auto 18px;
            background: white;
            box-shadow: 0 2px 8px #0005;
            overflow: hidden;
        }

        /*
         * Couche 1 : rendu graphique du PDF.
         */

        .pdf-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .page-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-size: 13px;
            pointer-events: none;
        }

        /*
         * Couche 2 : texte sélectionnable.
         */

        .pdf-page .textLayer {
            position: absolute;
            inset: 0;
            z-index: 2;
            overflow: hidden;
            opacity: 1;
            line-height: 1;
            transform-origin: 0 0;

            -webkit-text-size-adjust: none;
            -moz-text-size-adjust: none;
            text-size-adjust: none;

            user-select: text;
            -webkit-user-select: text;

            cursor: text;
            pointer-events: auto;
        }

        .pdf-page .textLayer span,
        .pdf-page .textLayer br {
            color: transparent !important;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;

            user-select: text;
            -webkit-user-select: text;
        }

        /*
         * Surlignage natif de la sélection.
         */

        .pdf-page .textLayer ::selection {
            background: rgba(40, 120, 255, 0.45);
            color: transparent;
        }

        .pdf-page .textLayer ::-moz-selection {
            background: rgba(40, 120, 255, 0.45);
            color: transparent;
        }

        /*
         * Couche 3 : surlignage de la recherche.
         */

        .search-highlights {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 3;
            pointer-events: none;
        }

        .search-highlight {
            position: absolute;
            background: rgba(255, 225, 0, .40);
            border: 1px solid rgba(210, 160, 0, .40);
            border-radius: 2px;
        }

        .search-highlight.current {
            background: rgba(255, 145, 0, .65);
            border: 2px solid #e47700;
        }

        /*
         * Couche 4 : liens du PDF.
         */

        .pdf-links {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 4;
            pointer-events: none;
        }

        .pdf-link {
            position: absolute;
            display: block;
            background: transparent;
            border: 0;
            outline-offset: -1px;
            cursor: pointer;
            pointer-events: auto;
        }

        .pdf-link:hover {
            background: rgba(60, 130, 230, .10);
        }

        .pdf-link:focus-visible {
            outline: 2px solid #2878df;
        }

        /* =====================================
           CHARGEMENT ET ERREURS
           ===================================== */

        #loading {
            padding: 40px 20px;
            text-align: center;
            color: white;
        }

        #error {
            display: none;
            margin: 15px;
            padding: 12px;
            color: #900;
            background: #fff0f0;
            border: 1px solid #d88;
            white-space: pre-wrap;
        }

        @media (max-width: 700px) {
            #sidebar {
                flex-basis: 230px;
                width: 230px;
            }

            #toolbar-row {
                justify-content: flex-start;
            }

            #docText {
                display: none;
            }

            #reviewBadge .label {
                display: none;
            }

            :root {
                --notes-width: 230px;
            }
        }
        /* =====================================
           THÈME CLAIR (READER_THEME = "light", <html class="light">)
           The look of the other pages (static/style.css): beige
           background, serif font, small caps, white boxes with a grey
           shadow, golden hover, dark red accents. The PDF pages are not
           changed. Nested rules: they win over the ones above (the dark
           theme, by default).
           ===================================== */

        html.light {

            body {
                font-family: serif;
                background: #e9e6e2;
            }

            #toolbar {
                color: #222;
                background: #f4f2ef;
                border-bottom: 1px solid #00000040;
                box-shadow: 0 1px 5px #80808080;
            }

            #docName {
                color: #222;
                font-size: 14px;
                font-weight: bold;
            }

            #toolbar-row,
            #searchbar {
                font-size: 14px;
            }

            #toolbar label,
            #pageCount,
            #status,
            #searchbar label,
            #searchStatus,
            #sidebar-header h2 {
                font-variant: small-caps;
            }

            #status,
            #searchStatus {
                color: #666;
            }

            #toolbar button,
            #searchbar button,
            #sidebar-header button {
                border: 1px solid #00000080;
                background: #fff;
                color: #222;
                box-shadow: 1px 1px 3px #80808080;
            }

            #toolbar button:hover:not(:disabled),
            #searchbar button:hover,
            #sidebar-header button:hover,
            #homeLink:hover,
            #homeLink:focus-visible {
                background: #f9e3b0;
            }

            #currentPage,
            #zoomLevel,
            #searchInput {
                border: 1px solid #00000080;
            }

            /* (white fields, as the buttons of this theme) */
            #currentPage,
            #zoomLevel {
                background: #fff;
                color: #222;
                caret-color: auto;
            }

            #currentPage:focus,
            #zoomLevel:focus {
                outline: revert;
            }

            #reviewBadge {
                border-radius: 0.3em;
                background: #8a6d3b;
                font-variant: small-caps;
            }

            #reviewBadge:hover,
            #reviewBadge:focus-visible {
                background: darkred;
            }

            #searchbar {
                background: #f4f2ef;

<body>

        <div class="toolbar-group" id="homeGroup">

        </button>

    <!-- =====================================
         ESPACE PRINCIPAL
         ===================================== -->

    <div id="workspace">

        <aside id="sidebar">

            <div id="sidebar-header">
                <h2>Index du document</h2>

                <!-- Boutons pour replier et déplier l'index -->
                <div id="outline-controls">

                    <button

                        −
                    </button>

                        id="expandAll"

                        +

                    du passage lu (avec le texte sélectionné, cité).</div>
                <div id="notes-layer"></div>

                Chargement du document PDF...
            </div>
            <!-- the pages (scaled as a whole while pinched) -->

        </div>

        <div id="notes-nav">
            <button id="previousNote" type="button" title="Note précédente" aria-label="Note précédente">▲</button>
            <button id="nextNote" type="button" title="Note suivante" aria-label="Note suivante">▼</button>
        </div>

    </div>

    <div id="error"></div>


    <!-- =====================================
         JAVASCRIPT
         ===================================== -->

    <script>
    (() => {
        "use strict";

        // =========================================
        // CONFIGURATION
        // =========================================

        const params = new URLSearchParams(window.location.search);

        const DOCUMENT_ID =
            params.get("documentId") || "{{ documentId }}";

        const DOCUMENT_NAME =
            params.get("documentName") || "{{ documentName }}";

        /*
         * Le paramètre de version évite de conserver
         * une ancienne version du PDF dans le cache HTTP.
         */

        // const PDF_URL = "document.pdf?v=" + Date.now();
        const PDF_URL = "{{ pdfurl }}?v=" + Date.now();

        /*
         * L'API Flask est servie sur la même origine.
         */
        const API_BASE_URL = "/api";

        const MAX_CACHED_CANVASES = 8;
        const OBSERVER_MARGIN = "1000px 0px";
        const EVICTION_DISTANCE = 1800;

        const INITIAL_SCALE = 1.5;
        const MIN_SCALE = 0.4;
        const MAX_SCALE = 2.5;
        const SCALE_STEP = 0.1;

        const MAX_DEVICE_PIXEL_RATIO = 1.5;
        const MAX_CONCURRENT_RENDERS = 2;

        const STATE_SYNC_DELAY = 500;

        // =========================================
        // ÉLÉMENTS HTML
        // =========================================

        const $ = id => document.getElementById(id);

        const container = $("pdf-container");
        const workspace = $("workspace");

        const outlineContainer = $("outline-container");
        const outlineStatus = $("outline-status");

        const loading = $("loading");
        const pagesBox = $("pdf-pages");
        const errorElement = $("error");

        const currentPageInput = $("currentPage");
        const pageCountElement = $("pageCount");

        const zoomLevelInput = $("zoomLevel");
        const statusElement = $("status");

        const searchbar = $("searchbar");
        const searchInput = $("searchInput");
        const searchStatus = $("searchStatus");

        const matchCaseCheckbox = $("matchCase");
        const wholeWordCheckbox = $("wholeWord");

        const backButton = $("goBack");
        const forwardButton = $("goForward");

        // =========================================
        // ÉTAT DU LECTEUR
        // =========================================

        let pdfDoc = null;
        let scale = INITIAL_SCALE;

        let currentPageNumber = 1;

        let pageObserver = null;
        let scrollFrame = null;
        let resizeTimer = null;

        let destroyed = false;
        let restoringState = false;

        const pages = [];
        let outlineEntries = [];

        let cachedCanvasCount = 0;
        let usageCounter = 0;
        let activeRenderCount = 0;

        const renderQueue = [];
        const queuedPages = new Set();

        // =========================================
        // HISTORIQUE DE NAVIGATION
        // =========================================

        /*
         * Historique de navigation interne.
         *
         * Les états contiennent page, coordonnées PDF et zoom.
         */
        const backHistory = [];
        const forwardHistory = [];

        /*
         * Point de vue d'avant les sauts de la recherche en cours : ajouté
         * à l'historique, comme un seul saut, quand la recherche est
         * fermée (Échap, ✕), ou avant un autre saut de l'historique.
         * Une promesse : la position est lue en asynchrone, les sauts
         * de la recherche l'attendent avant de déplacer la vue.
         */
        let searchOrigin = null;

        /*
         * État transmis au serveur.
         */
        const pdfReaderState = {
            documentId: DOCUMENT_ID,
            documentName: DOCUMENT_NAME,
            pageNumber: 1,
            positionX: 0,
            positionY: 0,
            zoom: 1,
            updatedAt: null
        };

        // =====================================================
        // UTILITAIRES
        // =====================================================

        function updateStatus(message) {
            statusElement.textContent = message;
        }

        function showError(message) {
            errorElement.style.display = "block";
            errorElement.textContent = message;
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function nextFrame() {
            return new Promise(resolve =>
                requestAnimationFrame(resolve)
            );
        }

        function getContainerRect() {
            return container.getBoundingClientRect();
        }

        function updateHistoryButtons() {
            // (une recherche a déplacé la vue : retour à son point de départ)
            backButton.disabled =
                backHistory.length === 0 && !searchOrigin;
            forwardButton.disabled = forwardHistory.length === 0;
        }

        /*
         * La recherche a déplacé la vue : son point de départ entre dans
         * l'historique (une seule fois).
         */
        async function commitSearchOrigin() {
            if (!searchOrigin) return;

            const pending = searchOrigin;
            searchOrigin = null;

            const view = await pending;

            if (view) {
                backHistory.push(view);
                forwardHistory.length = 0;
            }

            updateHistoryButtons();
        }

        // =====================================================
        // POSITION DU LECTEUR
        // =====================================================

        /*
        * Calcule l'état de lecture.
        *
        * positionX et positionY sont convertis en coordonnées
        * du PDF d'origine à l'aide de PDF.js.
        */
        async function getPdfReaderState() {
            if (!pdfDoc || !pages.length) {
                return null;
            }

            const pageNumber = findCurrentPage();
            const info = pages[pageNumber - 1];

            if (!info) {
                return null;
            }

            await loadPageMetadata(info);

            const pdfPage = await pdfDoc.getPage(pageNumber);

            const viewport = pdfPage.getViewport({
                scale
            });

            const containerRect = getContainerRect();
            const pageRect = info.shell.getBoundingClientRect();

            /*
            * Coordonnées du coin supérieur gauche du conteneur
            * par rapport au coin supérieur gauche de la page.
            */
            const displayedX = clamp(
                containerRect.left - pageRect.left,
                0,
                viewport.width
            );

            const displayedY = clamp(
                containerRect.top - pageRect.top,
                0,
                viewport.height
            );

            /*
            * Conversion depuis les coordonnées d'affichage
            * vers le repère PDF.
            */
            const pdfPoint = viewport.convertToPdfPoint(
                displayedX,
                displayedY
            );

            return {
                documentId: DOCUMENT_ID,
                documentName: DOCUMENT_NAME,
                pageNumber,
                positionX: pdfPoint[0],
                positionY: pdfPoint[1],
                zoom: scale,
                updatedAt: new Date().toISOString()
            };
        }

            /*
        * Conserve l'état courant dans l'historique.
            */
        async function captureView() {
            const state = await getPdfReaderState();

            if (!state) return null;

                return {
                pageNumber: state.pageNumber,
                positionX: state.positionX,
                positionY: state.positionY,
                zoom: state.zoom
                };
            }

        // =====================================================
        // COMMUNICATION AVEC FLASK
        // =====================================================

        let stateSyncTimer = null;
        let stateSyncInProgress = false;
        let stateSyncPending = false;

        /*
        * Envoi de l'état au serveur.
        *
        * Si une requête est en cours, une nouvelle sauvegarde
        * est programmée plutôt que de lancer des requêtes
        * concurrentes susceptibles d'arriver dans le désordre.
        */
        async function sendPdfReaderState() {
            if (destroyed || restoringState || !pdfDoc) {
                return;
            }

            if (stateSyncInProgress) {
                stateSyncPending = true;
                return;
            }

            const state = await getPdfReaderState();

            if (!state || destroyed || restoringState) {
                return;
            }

            stateSyncInProgress = true;
            stateSyncPending = false;

            try {
                const response = await fetch(
                    `${API_BASE_URL}/reader/state`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(state)
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `Erreur HTTP ${response.status}`
                    );
                }

                Object.assign(pdfReaderState, state);

            } catch (error) {
                console.error(
                    "Impossible de sauvegarder l'état du lecteur :",
                    error
                );

                updateStatus(
                    "Lecture locale — sauvegarde serveur indisponible"
                );

            } finally {
                stateSyncInProgress = false;

                if (stateSyncPending && !destroyed) {
                    stateSyncPending = false;
                    scheduleStateSync(100);
                }
            }
        }

        /*
        * Regroupe les événements rapprochés.
        */
        function scheduleStateSync(delay = STATE_SYNC_DELAY) {
            if (restoringState || destroyed) return;

            clearTimeout(stateSyncTimer);

            stateSyncTimer = setTimeout(
                sendPdfReaderState,
                delay
            );
        }

        /*
        * Récupération de l'état enregistré dans le fichier JSON.
        */
        async function loadPdfReaderState() {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/reader/state/` +
                    encodeURIComponent(DOCUMENT_ID),
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );

                if (response.status === 404) {
                    return null;
                }

                if (!response.ok) {
                    throw new Error(
                        `Erreur HTTP ${response.status}`
                    );
                }

                return await response.json();

            } catch (error) {
                console.warn(
                    "Impossible de récupérer l'état enregistré :",
                    error
                );

                return null;
            }
        }

        /*
        * Restaure un état venant du serveur.
        */
        async function restorePdfReaderState(state) {
            if (!state || !pdfDoc) return;

            restoringState = true;

            try {
                const pageNumber = clamp(
                    Math.trunc(Number(state.pageNumber) || 1),
                    1,
                    pdfDoc.numPages
                );

                const savedZoom = clamp(
                    Number(state.zoom) || 1,
                    MIN_SCALE,
                    MAX_SCALE
                );

                await setZoom(savedZoom, false);

                const info = pages[pageNumber - 1];

                await loadPageMetadata(info);

                /*
                * Attendre que les dimensions des conteneurs
                * soient à jour après le changement de zoom.
                */
                await nextFrame();
                await nextFrame();

                const pdfPage = await pdfDoc.getPage(pageNumber);

                const viewport = pdfPage.getViewport({
                    scale
                });

                const x = Number(state.positionX) || 0;
                const y = Number(state.positionY) || 0;

                /*
                * Conversion des coordonnées PDF sauvegardées
                * vers les coordonnées affichées.
                */
                const point = viewport.convertToViewportPoint(x, y);

                const containerRect = getContainerRect();
                const pageRect = info.shell.getBoundingClientRect();

                const pageTop =
                    pageRect.top -
                    containerRect.top +
                    container.scrollTop;

                const pageLeft =
                    pageRect.left -
                    containerRect.left +
                    container.scrollLeft;

                const targetTop = pageTop + point[1];
                const targetLeft = pageLeft + point[0];

                container.scrollTo({
                    top: clamp(
                        targetTop,
                        0,
                        Math.max(
                            0,
                            container.scrollHeight - container.clientHeight
                        )
                    ),
                    left: clamp(
                        targetLeft,
                        0,
                        Math.max(
                            0,
                            container.scrollWidth - container.clientWidth
                        )
                    ),
                    behavior: "auto"
                });

                currentPageNumber = pageNumber;
                currentPageInput.value = pageNumber;

                requestRender(info, 1000);

                await nextFrame();

                scheduleViewportUpdate();

            } finally {
                /*
                * Laisse la restauration se terminer avant
                * de réactiver les sauvegardes automatiques.
                */
                await nextFrame();

                restoringState = false;
            }
        }

        // =========================================
        // INITIALISATION
        // =========================================

        async function initialize() {
            try {
                if (typeof pdfjsLib === "undefined") {
                    throw new Error(
                        "PDF.js n'a pas pu être chargé. " +
                        "Vérifiez votre connexion Internet."
                    );
                }

                if (
                    typeof pdfjsLib.renderTextLayer !== "function"
                ) {
                    throw new Error(
                        "La fonction renderTextLayer de PDF.js " +
                        "n'est pas disponible. Vérifiez que le " +
                        "fichier pdf.min.js correspond bien à la " +
                        "version 3.11.174."
                    );
                }

                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    "{{ url_for('static', filename='libs/pdf.worker.min_3.11.174.js')}}";

                const loadingTask = pdfjsLib.getDocument({
                    url: PDF_URL,
                    rangeChunkSize: 65536,
                    disableRange: false,
                    disableStream: true,
                    disableAutoFetch: true,
                    stopAtErrors: false
                });

                pdfDoc = await loadingTask.promise;

                if (destroyed) return;

                loading.remove();

                currentPageInput.disabled = false;
                currentPageInput.max = pdfDoc.numPages;

                pageCountElement.textContent =
                    "/ " + pdfDoc.numPages;

                zoomLevelInput.disabled = false;
                $("zoomIn").disabled = false;
                $("zoomOut").disabled = false;
                $("fitWidth").disabled = false;
                $("downloadPdf").disabled = false;

                const firstPage = await pdfDoc.getPage(1);

                const firstViewport = firstPage.getViewport({
                    scale: 1
                });

                /*
                 * Création des conteneurs des pages.
                 *
                 * Le canvas et la couche de texte ne sont
                 * créés que lorsque la page doit être rendue.
                 */

                for (
                    let number = 1;
                    number <= pdfDoc.numPages;
                    number++
                ) {
                    const shell = document.createElement("div");

                    shell.className = "pdf-page";
                    shell.dataset.pageNumber = number;

                    const placeholder =
                        document.createElement("div");

                    placeholder.className = "page-placeholder";
                    placeholder.textContent = "Page " + number;

                    shell.appendChild(placeholder);

                    const info = {
                        pageNumber: number,
                        shell,

                        widthAtScale1: firstViewport.width,
                        heightAtScale1: firstViewport.height,

                        metadataLoaded: number === 1,

                        canvas: null,
                        rendered: false,
                        rendering: false,
                        renderTask: null,

                        generation: 0,
                        lastUsed: 0,
                        error: null,

                        /*
                         * Texte brut utilisé par la recherche.
                         */

                        textContent: null,
                        textPromise: null,

                        /*
                         * Texte brut utilisé par la couche
                         * de sélection PDF.js.
                         */

                        pdfTextContent: null,
                        pdfTextPromise: null,

                        textLayer: null,
                        textLayerTask: null,

                        annotations: null,
                        annotationsPromise: null,

                        linksLayer: null,
                        highlightLayer: null
                    };

                    pages.push(info);

                    pagesBox.appendChild(shell);

                    updateShellSize(info);
                }

                await loadOutline();

                if (destroyed) return;

                setupObserver();
                setupControls();

                /*
                 * La position sauvegardée est restaurée après
                 * la création des pages et de l'observateur.
                 */
                const savedState = await loadPdfReaderState();

                if (destroyed) return;

                if (savedState) {
                    await restorePdfReaderState(savedState);
                } else {
                    requestRender(pages[0], 1000);
                }

                updateStatus(
                    pdfDoc.numPages + " pages"
                );

                updateHistoryButtons();

            } catch (error) {
                console.error(error);

                loading.textContent =
                    "Impossible de charger le PDF.";

                showError(
                    "Erreur lors du chargement du PDF :\n" +
                    error.message
                );

                updateStatus("Erreur");
            }
        }

        // =========================================
        // DESTINATIONS PDF
        // =========================================

        async function resolveDestination(destination) {
            if (destination == null) return null;

            let resolved = destination;

            if (typeof destination === "string") {
                resolved =
                    await pdfDoc.getDestination(destination);
            }

            if (
                !Array.isArray(resolved) ||
                resolved.length === 0
            ) {
                return null;
            }

            const reference = resolved[0];

            let pageIndex;

            if (
                reference &&
                typeof reference === "object"
            ) {
                pageIndex =
                    await pdfDoc.getPageIndex(reference);

            } else if (Number.isInteger(reference)) {
                pageIndex = reference;

            } else {
                return null;
            }

            if (
                pageIndex < 0 ||
                pageIndex >= pdfDoc.numPages
            ) {
                return null;
            }

            return {
                pageNumber: pageIndex + 1,
                destination: resolved
            };
        }

        async function goToDestination(
            destination,
            saveHistory = true
        ) {
            try {
                const resolved =
                    await resolveDestination(destination);

                if (!resolved) return;

                /*
                 * Enregistrer le point de départ avant
                 * de suivre le lien interne.
                 */
                if (saveHistory) {
                    // (un lien suivi pendant une recherche : son point
                    // de départ d'abord)
                    await commitSearchOrigin();

                    const current = await captureView();

                    if (current) {
                        backHistory.push(current);
                        forwardHistory.length = 0;
                        updateHistoryButtons();
                    }
                }

                const pageNumber = resolved.pageNumber;
                const dest = resolved.destination;

                const info = pages[pageNumber - 1];

                const pdfPage =
                    await pdfDoc.getPage(pageNumber);

                await loadPageMetadata(info);

                const viewport = pdfPage.getViewport({
                    scale
                });

                const type = dest[1]?.name || "XYZ";

                let targetX = viewport.width / 2;
                let targetY = viewport.height / 2;

                if (type === "XYZ") {
                    const left = dest[2];
                    const top = dest[3];

                    if (left != null) {
                        targetX =
                            viewport.convertToViewportPoint(
                                left,
                                0
                            )[0];
                    }

                    if (top != null) {
                        targetY =
                            viewport.convertToViewportPoint(
                                0,
                                top
                            )[1];
                    }

                } else if (
                    type === "FitH" ||
                    type === "FitBH"
                ) {
                    const top = dest[2];

                    if (top != null) {
                        targetY =
                            viewport.convertToViewportPoint(
                                0,
                                top
                            )[1];
                    }

                } else if (
                    type === "FitV" ||
                    type === "FitBV"
                ) {
                    const left = dest[2];

                    if (left != null) {
                        targetX =
                            viewport.convertToViewportPoint(
                                left,
                                0
                            )[0];
                    }

                } else if (type === "FitR") {
                    const left = dest[2];
                    const bottom = dest[3];
                    const right = dest[4];
                    const top = dest[5];

                    if (
                        left != null &&
                        bottom != null &&
                        right != null &&
                        top != null
                    ) {
                        const centerX =
                            (left + right) / 2;

                        const centerY =
                            (bottom + top) / 2;

                        const point =
                            viewport.convertToViewportPoint(
                                centerX,
                                centerY
                            );

                        targetX = point[0];
                        targetY = point[1];
                    }

                } else if (
                    type === "Fit" ||
                    type === "FitB"
                ) {
                    targetX = viewport.width / 2;
                    targetY = viewport.height / 2;
                }

                currentPageNumber = pageNumber;
                currentPageInput.value = pageNumber;

                requestRender(info, 1000);

                await nextFrame();

                const containerRect =
                    getContainerRect();

                const pageRect =
                    info.shell.getBoundingClientRect();

                const pageTop =
                    pageRect.top -
                    containerRect.top +
                    container.scrollTop;

                const pageLeft =
                    pageRect.left -
                    containerRect.left +
                    container.scrollLeft;

                /*
                 * Centrer le point de destination
                 * dans la zone visible du lecteur.
                 */

                const desiredTop =
                    pageTop +
                    targetY -
                    container.clientHeight / 2;

                const desiredLeft =
                    pageLeft +
                    targetX -
                    container.clientWidth / 2;

                const maxScrollTop =
                    container.scrollHeight -
                    container.clientHeight;

                const maxScrollLeft =
                    container.scrollWidth -
                    container.clientWidth;

                container.scrollTo({
                    top: clamp(
                        desiredTop,
                        0,
                        Math.max(0, maxScrollTop)
                    ),

                    left: clamp(
                        desiredLeft,
                        0,
                        Math.max(0, maxScrollLeft)
                    ),

                    behavior: "auto"
                });

                updateActiveOutline(pageNumber);

                scheduleViewportUpdate();
                scheduleStateSync();

            } catch (error) {
                console.warn(
                    "Impossible de suivre la destination PDF.",
                    error
                );
            }
        }

    // =====================================================
    // HISTORIQUE PRÉCÉDENT / SUIVANT
    // =====================================================

    async function restoreHistoryView(view) {
        if (!view || !pdfDoc) return;

        restoringState = true;

        try {
            await setZoom(view.zoom, false);

            const info = pages[view.pageNumber - 1];

            await loadPageMetadata(info);

            const pdfPage = await pdfDoc.getPage(view.pageNumber);

            const viewport = pdfPage.getViewport({
                scale
            });

            const point = viewport.convertToViewportPoint(
                view.positionX,
                view.positionY
            );

            await nextFrame();

            const containerRect = getContainerRect();
            const pageRect = info.shell.getBoundingClientRect();

            const pageTop =
                pageRect.top -
                containerRect.top +
                container.scrollTop;

            const pageLeft =
                pageRect.left -
                containerRect.left +
                container.scrollLeft;

            container.scrollTo({
                top: Math.max(0, pageTop + point[1]),
                left: Math.max(0, pageLeft + point[0]),
                behavior: "auto"
            });

            currentPageNumber = view.pageNumber;
            currentPageInput.value = view.pageNumber;

            requestRender(info, 1000);

        } finally {
            await nextFrame();
            restoringState = false;

            updateHistoryButtons();
            scheduleViewportUpdate();
            scheduleStateSync();
        }
    }

    async function goBack() {
        // (pendant une recherche : retour d'abord à son point de départ)
        await commitSearchOrigin();

        if (!backHistory.length) return;

        const current = await captureView();

        if (current) {
            forwardHistory.push(current);
        }

        const previous = backHistory.pop();

        updateHistoryButtons();

        await restoreHistoryView(previous);
    }

    async function goForward() {
        await commitSearchOrigin();

        if (!forwardHistory.length) return;

        const current = await captureView();

        if (current) {
            backHistory.push(current);
        }

        const next = forwardHistory.pop();

        updateHistoryButtons();

        await restoreHistoryView(next);
    }

        // =========================================
        // SIGNETS / INDEX DU DOCUMENT
        // =========================================

        async function loadOutline() {
            outlineContainer.replaceChildren();

            const outline = await pdfDoc.getOutline();

            if (!outline || !outline.length) {
                outlineStatus.textContent =
                    "Ce document ne contient pas de signets.";

                outlineContainer.appendChild(outlineStatus);
                return;
            }

            outlineEntries = [];

            async function resolveItems(
                items,
                ancestors = []
            ) {
                for (const item of items) {
                    let resolved = null;

                    if (item.dest != null) {
                        try {
                            resolved =
                                await resolveDestination(item.dest);
                        } catch (error) {
                            console.warn(
                                "Destination non résolue :",
                                item.title,
                                error
                            );
                        }
                    }

                    const entry = {
                        item,
                        title: item.title || "(Sans titre)",

                        pageNumber: resolved
                            ? resolved.pageNumber
                            : null,

                        ancestors,
                        row: null,
                        childrenContainer: null,
                        toggleButton: null
                    };

                    outlineEntries.push(entry);

                    if (item.items && item.items.length) {
                        await resolveItems(
                            item.items,
                            ancestors.concat(entry)
                        );
                    }
                }
            }

            await resolveItems(outline);

            if (destroyed) return;

            outlineStatus.remove();

            const root = document.createElement("ul");
            root.className = "outline-list";

            const entriesByItem = new Map();

            for (const entry of outlineEntries) {
                entriesByItem.set(entry.item, entry);
            }

            function build(items, parent, depth = 0) {
                for (const item of items) {
                    const entry =
                        entriesByItem.get(item);

                    if (!entry) continue;

                    const li = document.createElement("li");
                    li.className = "outline-item";

                    const row = document.createElement("div");
                    row.className = "outline-row";

                    entry.row = row;

                    const hasChildren =
                        item.items &&
                        item.items.length > 0;

                    const toggle =
                        document.createElement("button");

                    toggle.type = "button";
                    toggle.className = "outline-toggle";

                    toggle.textContent =
                        hasChildren ? "▾" : "·";

                    if (!hasChildren) {
                        toggle.classList.add("empty");
                        toggle.disabled = true;
                    }

                    entry.toggleButton = toggle;

                    row.appendChild(toggle);

                    const link =
                        document.createElement("button");

                    link.type = "button";
                    link.className = "outline-link";

                    const title =
                        document.createElement("span");

                    title.className = "outline-title";
                    title.textContent = entry.title;

                    const pageLabel =
                        document.createElement("span");

                    pageLabel.className = "outline-page";

                    pageLabel.textContent =
                        entry.pageNumber ?? "—";

                    link.append(title, pageLabel);

                    row.appendChild(link);
                    li.appendChild(row);
                    parent.appendChild(li);

                    link.addEventListener("click", async () => {
                        if (entry.item.dest != null) {
                            await goToDestination(
                                entry.item.dest,
                                true
                            );
                        }
                    });

                    if (hasChildren) {
                        const children =
                            document.createElement("ul");

                        children.className =
                            "outline-list outline-children";

                        entry.childrenContainer = children;

                        li.appendChild(children);

                        toggle.addEventListener("click", () => {
                            const collapsed =
                                children.classList.toggle(
                                    "collapsed"
                                );

                            toggle.textContent =
                                collapsed ? "▸" : "▾";
                        });

                        if (depth >= 2) {
                            children.classList.add("collapsed");
                            toggle.textContent = "▸";
                        }

                        build(
                            item.items,
                            children,
                            depth + 1
                        );
                    }
                }
            }

            build(outline, root);

            outlineContainer.appendChild(root);
        }

        /*
         * Replie toutes les branches de l'index.
         */
        function collapseAllOutline() {
            for (const entry of outlineEntries) {
                if (
                    entry.childrenContainer &&
                    entry.toggleButton
                ) {
                    entry.childrenContainer.classList.add(
                        "collapsed"
                    );

                    entry.toggleButton.textContent = "▸";
                }
            }
        }

        /*
         * Déplie toutes les branches de l'index,
         * quel que soit leur niveau d'imbrication.
         */
        function expandAllOutline() {
            for (const entry of outlineEntries) {
                if (
                    entry.childrenContainer &&
                    entry.toggleButton
                ) {
                    entry.childrenContainer.classList.remove(
                        "collapsed"
                    );

                    entry.toggleButton.textContent = "▾";
                }
            }
        }

        function updateActiveOutline(pageNumber) {
            if (!outlineEntries.length) return;

            const candidates =
                outlineEntries.filter(
                    entry =>
                        entry.pageNumber === pageNumber
                );

            const selected = candidates.length
                ? candidates[candidates.length - 1]
                : null;

            for (const entry of outlineEntries) {
                if (!entry.row) continue;

                entry.row.classList.toggle(
                    "active",
                    entry === selected
                );

                if (entry === selected) {
                    for (const ancestor of entry.ancestors) {
                        if (ancestor.childrenContainer) {
                            ancestor.childrenContainer
                                .classList.remove("collapsed");

                            ancestor.toggleButton.textContent = "▾";
                        }
                    }
                }
            }
        }

        // =========================================
        // GÉOMÉTRIE DES PAGES
        // =========================================

        function updateShellSize(info) {
            info.shell.style.width =
                info.widthAtScale1 * scale + "px";

            info.shell.style.height =
                info.heightAtScale1 * scale + "px";
        }

        async function loadPageMetadata(info) {
            if (info.metadataLoaded) return;

            const page =
                await pdfDoc.getPage(info.pageNumber);

            const viewport = page.getViewport({
                scale: 1
            });

            info.widthAtScale1 = viewport.width;
            info.heightAtScale1 = viewport.height;

            info.metadataLoaded = true;

            updateShellSize(info);
        }

        // =========================================
        // OBSERVATION DES PAGES
        // =========================================

        function setupObserver() {
            if (pageObserver) {
                pageObserver.disconnect();
            }

            pageObserver = new IntersectionObserver(
                entries => {
                    if (destroyed) return;

                    for (const entry of entries) {
                        if (!entry.isIntersecting) continue;

                        const number =
                            Number(
                                entry.target.dataset.pageNumber
                            );

                        const info = pages[number - 1];

                        if (!info) continue;

                        requestRender(info, 100);
                        touchPage(info);
                    }

                    scheduleViewportUpdate();

                },
                {
                    root: container,
                    rootMargin: OBSERVER_MARGIN,
                    threshold: [0, 0.1, 0.5, 1]
                }
            );

            for (const info of pages) {
                pageObserver.observe(info.shell);
            }
        }

        // =========================================
        // FILE D'ATTENTE DU RENDU
        // =========================================

        function requestRender(info, priority = 0) {
            if (destroyed || !pdfDoc) return;

            if (info.rendered || info.rendering) {
                touchPage(info);
                return;
            }

            if (queuedPages.has(info.pageNumber)) {
                return;
            }

            queuedPages.add(info.pageNumber);

            renderQueue.push({
                info,
                priority,
                sequence: usageCounter++
            });

            renderQueue.sort((a, b) =>
                b.priority - a.priority ||
                a.sequence - b.sequence
            );

            processRenderQueue();
        }

        function processRenderQueue() {
            while (
                !destroyed &&
                activeRenderCount < MAX_CONCURRENT_RENDERS &&
                renderQueue.length
            ) {
                const task = renderQueue.shift();
                const info = task.info;

                queuedPages.delete(info.pageNumber);

                if (
                    info.rendered ||
                    info.rendering
                ) {
                    continue;
                }

                activeRenderCount++;

                renderPage(info)
                    .catch(error => {
                        if (
                            error?.name !==
                            "RenderingCancelledException"
                        ) {
                            console.error(error);
                        }
                    })
                    .finally(() => {
                        activeRenderCount--;
                        processRenderQueue();
                    });
            }
        }

        // =========================================
        // COUCHE DE TEXTE SÉLECTIONNABLE
        // =========================================

        async function getPdfTextContent(info, pdfPage) {
            if (info.pdfTextContent) {
                return info.pdfTextContent;
            }

            if (info.pdfTextPromise) {
                return info.pdfTextPromise;
            }

            info.pdfTextPromise =
                pdfPage.getTextContent({
                    includeMarkedContent: true
                });

            try {
                info.pdfTextContent =
                    await info.pdfTextPromise;

                return info.pdfTextContent;

            } finally {
                info.pdfTextPromise = null;
            }
        }

        async function createTextLayer(
            info,
            pdfPage,
            viewport,
            generation
        ) {
            const textContent =
                await getPdfTextContent(info, pdfPage);

            if (
                destroyed ||
                generation !== info.generation
            ) {
                return;
            }

            const layer = document.createElement("div");

            layer.className = "textLayer";

            layer.style.width =
                viewport.width + "px";

            layer.style.height =
                viewport.height + "px";

            layer.style.setProperty(
                "--scale-factor",
                scale
            );

            info.shell.appendChild(layer);

            info.textLayer = layer;

            const textDivs = [];
            const textContentItemsStr = [];

            const renderTask =
                pdfjsLib.renderTextLayer({
                    textContent,
                    container: layer,
                    viewport,
                    textDivs,
                    textContentItemsStr
                });

            info.textLayerTask = renderTask;

            try {
                await renderTask.promise;

                if (
                    destroyed ||
                    generation !== info.generation
                ) {
                    layer.remove();

                    if (info.textLayer === layer) {
                        info.textLayer = null;
                    }

                    return;
                }

                layer.style.userSelect = "text";
                layer.style.webkitUserSelect = "text";

            } finally {
                if (info.textLayerTask === renderTask) {
                    info.textLayerTask = null;
                }
            }
        }

        // =========================================
        // RENDU DES PAGES
        // =========================================

        async function renderPage(info) {
            if (
                destroyed ||
                info.rendered ||
                info.rendering
            ) {
                return;
            }

            info.rendering = true;

            const generation = ++info.generation;

            let canvas = null;

            try {
                await loadPageMetadata(info);

                if (
                    destroyed ||
                    generation !== info.generation
                ) {
                    return;
                }

                evictCanvases(info);

                const pdfPage =
                    await pdfDoc.getPage(info.pageNumber);

                const viewport = pdfPage.getViewport({
                    scale
                });

                const outputScale = Math.min(
                    window.devicePixelRatio || 1,
                    MAX_DEVICE_PIXEL_RATIO
                );

                canvas = document.createElement("canvas");
                canvas.className = "pdf-canvas";

                canvas.width = Math.max(
                    1,
                    Math.floor(
                        viewport.width * outputScale
                    )
                );

                canvas.height = Math.max(
                    1,
                    Math.floor(
                        viewport.height * outputScale
                    )
                );

                canvas.style.width =
                    viewport.width + "px";

                canvas.style.height =
                    viewport.height + "px";

                const context = canvas.getContext("2d", {
                    alpha: false
                });

                if (!context) {
                    throw new Error(
                        "Impossible de créer le canvas."
                    );
                }

                const renderTask = pdfPage.render({
                    canvasContext: context,
                    viewport,

                    transform: outputScale !== 1
                        ? [
                            outputScale, 0,
                            0, outputScale,
                            0, 0
                        ]
                        : null,

                    background: "#ffffff"
                });

                info.renderTask = renderTask;

                await renderTask.promise;

                if (
                    destroyed ||
                    generation !== info.generation
                ) {
                    canvas.width = 0;
                    canvas.height = 0;
                    return;
                }

                /*
                 * Installer le canvas.
                 */

                info.shell.replaceChildren();

                info.shell.appendChild(canvas);

                info.canvas = canvas;
                info.rendered = true;
                info.error = null;

                cachedCanvasCount++;

                touchPage(info);

                /*
                 * Créer la couche de texte sélectionnable.
                 */

                try {
                    await createTextLayer(
                        info,
                        pdfPage,
                        viewport,
                        generation
                    );

                } catch (textError) {
                    console.error(
                        "Impossible de créer la couche de texte " +
                        "de la page " + info.pageNumber,
                        textError
                    );
                }

                if (
                    destroyed ||
                    generation !== info.generation
                ) {
                    return;
                }

                /*
                 * Créer les liens et les surlignages.
                 */

                await renderPageLinks(
                    info,
                    pdfPage,
                    viewport
                );

                drawHighlights(info);

            } catch (error) {
                if (
                    error?.name !==
                    "RenderingCancelledException"
                ) {
                    info.error = error;

                    console.error(
                        "Erreur page " + info.pageNumber,
                        error
                    );
                }

            } finally {
                if (info.generation === generation) {
                    info.renderTask = null;
                    info.rendering = false;
                }

                if (canvas && info.canvas !== canvas) {
                    canvas.width = 0;
                    canvas.height = 0;
                }
            }
        }

        // =========================================
        // LIENS DU PDF
        // =========================================

        async function getPageAnnotations(info, pdfPage) {
            if (info.annotations) {
                return info.annotations;
            }

            if (info.annotationsPromise) {
                return info.annotationsPromise;
            }

            info.annotationsPromise =
                pdfPage.getAnnotations({
                    intent: "display"
                });

            try {
                info.annotations =
                    await info.annotationsPromise;

                return info.annotations;

            } finally {
                info.annotationsPromise = null;
            }
        }

        async function renderPageLinks(
            info,
            pdfPage,
            viewport
        ) {
            if (!info.rendered || !info.canvas) {
                return;
            }

            if (info.linksLayer) {
                info.linksLayer.remove();
                info.linksLayer = null;
            }

            const annotations =
                await getPageAnnotations(info, pdfPage);

            if (
                destroyed ||
                !info.rendered ||
                !info.canvas
            ) {
                return;
            }

            const layer = document.createElement("div");
